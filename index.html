        // Куда смотрит зрачок — на игрока
        let lx = doodleX - m.x, ly = doodleY - m.y; const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
        ctx.lineWidth = 2.5; ctx.strokeStyle = shadeColor(col, -0.35);
        ctx.fillStyle = col;
        if (m.variant === 'bat') {
            const flap = Math.sin(m.phase * 7) * 0.6;
            for (const s of [-1, 1]) {
                ctx.beginPath(); ctx.moveTo(s * r * 0.6, -2);
                ctx.lineTo(s * r * 2.0, -r * 0.6 - flap * r); ctx.lineTo(s * r * 1.6, r * 0.2 - flap * r * 0.4);
                ctx.lineTo(s * r * 1.1, r * 0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#3b3b3b';
            ctx.beginPath(); ctx.arc(-r * 0.38 + lx * 2, -r * 0.15 + ly * 2, 3, 0, Math.PI * 2);
            ctx.arc(r * 0.38 + lx * 2, -r * 0.15 + ly * 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(-5, r * 0.35); ctx.lineTo(-3, r * 0.65); ctx.lineTo(-1, r * 0.35);
            ctx.moveTo(1, r * 0.35); ctx.lineTo(3, r * 0.65); ctx.lineTo(5, r * 0.35); ctx.fill();
        } else if (m.variant === 'brute') {
            ctx.beginPath();
            ctx.moveTo(-r * 0.7, -r * 0.6); ctx.lineTo(-r * 0.95, -r * 1.25); ctx.lineTo(-r * 0.3, -r * 0.8);
            ctx.moveTo(r * 0.7, -r * 0.6); ctx.lineTo(r * 0.95, -r * 1.25); ctx.lineTo(r * 0.3, -r * 0.8);
            ctx.stroke();
            ctx.beginPath(); ctx.roundRect(-r * 1.1, -r * 0.85, r * 2.2, r * 1.7, r * 0.5); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.15, 5, 0, Math.PI * 2); ctx.arc(r * 0.42, -r * 0.15, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3b3b3b';
            ctx.beginPath(); ctx.arc(-r * 0.42 + lx * 2, -r * 0.15 + ly * 2, 2.4, 0, Math.PI * 2);
            ctx.arc(r * 0.42 + lx * 2, -r * 0.15 + ly * 2, 2.4, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = shadeColor(col, -0.45); ctx.beginPath();   // сердитые брови
            ctx.moveTo(-r * 0.75, -r * 0.5); ctx.lineTo(-r * 0.2, -r * 0.3); ctx.moveTo(r * 0.75, -r * 0.5); ctx.lineTo(r * 0.2, -r * 0.3); ctx.stroke();
            ctx.fillStyle = '#fff';  // зубы
            ctx.beginPath();
            for (let i = -2; i <= 2; i++) { ctx.moveTo(i * 6 - 3, r * 0.35); ctx.lineTo(i * 6, r * 0.62); ctx.lineTo(i * 6 + 3, r * 0.35); }
            ctx.fill();
        } else {
            // «Клякса»: волнистый низ, один большой глаз
            ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0);
            const wob = Math.sin(m.phase * 4) * 2;
            ctx.lineTo(r, r * 0.6);
            for (let i = 3; i >= 0; i--) ctx.quadraticCurveTo(-r + (i + 0.5) * r / 2, r * 0.95 + wob * (i % 2 ? 1 : -1), -r + i * r / 2, r * 0.6);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, -r * 0.2, r * 0.42, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#3b3b3b';
            ctx.beginPath(); ctx.arc(lx * r * 0.18, -r * 0.2 + ly * r * 0.18, r * 0.2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    // Чёрная дыра: тёмное ядро и закрученные светящиеся рукава
    function drawDoodleHole(h) {
        ctx.save(); ctx.translate(h.x, h.y);
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, h.r + 10);
        g.addColorStop(0, '#2b2b2b'); g.addColorStop(0.6, 'rgba(60,58,50,0.9)'); g.addColorStop(1, 'rgba(60,58,50,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, h.r + 10, 0, Math.PI * 2); ctx.fill();
        ctx.rotate(h.rot); ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            ctx.rotate(Math.PI * 2 / 3);
            ctx.strokeStyle = i % 2 ? '#9b7ad8' : '#6d4fae';
            ctx.beginPath(); ctx.arc(h.r * 0.35, 0, h.r * 0.75, -0.3, 1.9); ctx.stroke();
        }
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath(); ctx.arc(0, 0, h.r * 0.45, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    // Гибель: короткая анимация, вспышка и тряска — потом экран итогов.
    function doodleDie(kind, hx, hy) {
        if (doodleDead) return;
        doodleDead = { kind, t: 0, hx: hx || doodleX, hy: hy || doodleY };
        doodleShake = kind === 'fall' ? 10 : 14;
        flashScreen(kind === 'hole' ? '#6d4fae' : '#e5533d', 0.45);
        playSynth('hit'); shakeScreen();
        doodleJetpackUntil = 0; doodlePropUntil = 0; doodleBootsUntil = 0;
        if (kind === 'monster') { doodleVy = Math.max(doodleVy, 120); createParticle(doodleX, doodleY, '#e5533d', 14, 520, 3); }
        resetCombo();
    }

    // Проверка касания кругом радиуса rad вдоль пути кубика за кадр (а не
    // только в конечной точке): на слабом телефоне за кадр пролетаем десятки
    // пикселей и могли бы «проскочить» сквозь монстра или дыру.
    function doodleSweepHit(x0, y0, x1, y1, cx, cy, rad) {
        const steps = Math.max(1, Math.min(30, Math.ceil(Math.abs(y1 - y0) / 8)));
        for (let s = 1; s <= steps; s++) {
            const px = x0 + (x1 - x0) * s / steps, py = y0 + (y1 - y0) * s / steps;
            const dx = px - cx, dy = py - cy;
            if (dx * dx + dy * dy < rad * rad) return { x: px, y: py };
        }
        return null;
    }

    function loopDoodle(time) {
        if(!isPlaying) return;
        let dt = (time - lastTime) / 1000; lastTime = time; if(dt > 0.1) dt = 0.1; if (!(dt > 0)) dt = 0;
        ctx.clearRect(0, 0, width, height); drawBackground(dt);
        const nowMs = performance.now();

        // Тряска камеры — затухает экспоненциально по dt
        doodleShake *= Math.exp(-DOODLE_SHAKE_DECAY * dt);
        if (doodleShake < 0.3) doodleShake = 0;
        ctx.save();
        if (doodleShake) ctx.translate((Math.random() * 2 - 1) * doodleShake, (Math.random() * 2 - 1) * doodleShake);

        // Горизонталь и наклон — через dt, а не «за кадр». Раньше при
        // просадке FPS кубик объективно МЕДЛЕННЕЕ ехал вбок и не успевал
        // долететь до платформы, хотя по высоте прыжка хватало.
        // Форма 1-exp(-k*dt) — это то же экспоненциальное сглаживание,
        // но одинаковое на любом фреймрейте.
        if (!doodleDead) {
            let hLerp = 1 - Math.exp(-DOODLE_H_SPEED * dt);
            doodleTilt += ((playerX - doodleX > 0 ? 0.6 : -0.6) - doodleTilt) * (1 - Math.exp(-13 * dt));
            doodleX += (playerX - doodleX) * hLerp;
            if (doodleX < -20) doodleX = width + 20; if (doodleX > width + 20) doodleX = -20;
        }
        let prevX = doodleX, prevY = doodleY;

        // ВАЖНО: физика здесь считается через dt (реальные секунды), а не
        // "за кадр" — иначе на слабом телефоне или при просадке FPS игрок
        // объективно прыгает НИЖЕ (меньше шагов интеграции за то же время
        // подъёма), и платформа, которая обычно легко досягаема, вдруг
        // оказывается недостижимой. Числа подобраны так, чтобы при dt~1/60с
        // давать точно ту же высоту прыжка, что была раньше при 60 FPS —
        // но теперь одинаковую на любом устройстве.
        let jetpackOn = !doodleDead && nowMs < doodleJetpackUntil;
        let propOn = !doodleDead && !jetpackOn && nowMs < doodlePropUntil;
        let flying = jetpackOn || propOn;   // в полёте — сквозь платформы, монстров сбиваем, дыры не тянут
        let bootsOn = !doodleDead && nowMs < doodleBootsUntil;
        if (doodleDead && doodleDead.kind === 'hole') {
            // Затягивает в центр дыры, крутит и уменьшает
            const k = 1 - Math.exp(-10 * dt);
            doodleX += (doodleDead.hx - doodleX) * k; doodleY += (doodleDead.hy - doodleY) * k;
            doodleTilt += 16 * dt;
            doodleScale = Math.max(0, 1 - doodleDead.t / DOODLE_HOLE_SUCK_TIME);
        } else {
            if (jetpackOn) {
                doodleVy = DOODLE_JETPACK_VY;
                if (Math.random() < 0.75) {
                    // Искры и дымок из обоих сопел
                    const side = Math.random() < 0.5 ? -22 : 22;
                    createParticle(doodleX + side, doodleY + 22, Math.random() < 0.5 ? '#f08a3c' : '#f9c74f', 1, 220, 2.6);
                    if (Math.random() < 0.5) particles.push({ x: doodleX + side, y: doodleY + 30, vx: (Math.random() - 0.5) * 40,
                        vy: 150 + Math.random() * 80, life: 0.9, color: 'rgba(170,160,150,0.45)', size: 4 + Math.random() * 3, g: 0 });
                }
            } else if (propOn) {
                doodleVy = DOODLE_PROPELLER_VY;
                if (Math.random() < 0.25) createParticle(doodleX, doodleY - 30, 'rgba(217,164,0,0.8)', 1, 200, 2);
            } else {
                doodleVy += DOODLE_GRAVITY * dt;
            }
            doodleY += doodleVy * dt;
            if (doodleDead && doodleDead.kind === 'monster') doodleTilt += 10 * dt;  // кувыркается вниз
        }

        // Сжатие пружинит обратно к 1 за ~0.15с — заметно, но не мешает.
        doodleSquash += (1 - doodleSquash) * Math.min(dt * 11, 1);

        if (!doodleDead && doodleY < height * 0.45 && doodleVy < 0) {
            let shift = height * 0.45 - doodleY;
            doodleY = height * 0.45; prevY += shift;
            doodleHeight += shift;
            for (let p of doodlePlatforms) p.y += shift;
            for (let m of doodleMonsters) { m.y += shift; m.by += shift; }
            for (let h of doodleHoles) h.y += shift;
        }

        for (let i = doodlePlatforms.length - 1; i >= 0; i--) {
            let p = doodlePlatforms[i];
            if (p.type === 'moving') {
                let mvSpeed = 60 + Math.min(doodleHeight / 4000, 1) * 50;
                p.x += p.dir * mvSpeed * dt;
                if (p.x < p.minX) { p.x = p.minX; p.dir = 1; } else if (p.x > p.maxX) { p.x = p.maxX; p.dir = -1; }
            }
            if (p.y > height + 40) {
                doodlePlatforms.splice(i, 1);
                const ci = doodleChain.indexOf(p);
                if (ci >= 0 && doodleChain.length > 1) doodleChain.splice(ci, 1);
                continue;
            }

            const pc = PLATFORM_COLORS[p.type] || PLATFORM_COLORS.normal;
            let color = pc[1];
            if (p.type === 'break' && p.broken) {
                // Сломанная платформа не исчезает, а разламывается пополам и
                // падает, кувыркаясь и тая, — видно, что именно произошло.
                p.fallVy = (p.fallVy || 0) + DOODLE_GRAVITY * dt;
                p.fallY = (p.fallY || 0) + p.fallVy * dt;
                p.rot = (p.rot || 0) + 3.2 * dt;
                let a = Math.max(0, 1 - p.fallY / 260);
                if (a > 0) {
                    ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.fillStyle = pc[0]; ctx.lineWidth = 2;
                    for (let side of [-1, 1]) {
                        ctx.save();
                        ctx.translate(p.x + p.w / 2 + side * (p.w / 4 + p.fallY * 0.12), p.y + 7 + p.fallY);
                        ctx.rotate(side * p.rot);
                        ctx.beginPath(); ctx.roundRect(-p.w / 4, -7, p.w / 2 - 2, 14, 6); ctx.fill(); ctx.stroke();
                        ctx.restore();
                    }
                    ctx.globalAlpha = 1;
                }
            } else if (p.type === 'vanish' && p.gone) {
                // Исчезающая: после отскока расплывается и тает
                p.fade = Math.max(0, p.fade - DOODLE_VANISH_FADE * dt);
                if (p.fade > 0) {
                    const grow = (1 - p.fade) * 14;
                    ctx.globalAlpha = p.fade; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
                    ctx.beginPath(); ctx.roundRect(p.x - grow, p.y - grow * 0.3, p.w + grow * 2, 14, 7); ctx.stroke();
                    ctx.setLineDash([]); ctx.globalAlpha = 1;
                }
            } else {
                ctx.fillStyle = pc[0];
                ctx.strokeStyle = color; ctx.lineWidth = 2;
                if (p.type === 'vanish') {
                    // Пунктир и лёгкое мерцание — сразу видно, что «одноразовая»
                    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time / 1000 * 5 + p.x);
                    ctx.setLineDash([6, 4]); ctx.fillStyle = 'rgba(255,255,255,0.85)';
                }
                ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 14, 7); ctx.fill(); ctx.stroke();
                ctx.setLineDash([]); ctx.globalAlpha = 1;
                if (p.type === 'spring') drawSpringIcon(p.x, p.y, p.w);
                if (p.type === 'jetpack') drawJetpackIcon(p.x + p.w / 2, p.y);
                if (p.type === 'boots') drawBootsIcon(p.x + p.w / 2, p.y);
                if (p.type === 'propeller') drawPropellerIcon(p.x + p.w / 2, p.y);
            }

            // Касание платформы — по ПУТИ ног за кадр, а не по окну в 20px:
            // на 10–15 FPS за кадр пролетаем 50–80px и раньше проваливались
            // сквозь платформу. В полёте и после гибели коллизий нет.
            const feet = doodleY + 16, prevFeet = prevY + 16;
            if (!flying && !doodleDead && doodleVy > 0 && !p.broken && !p.gone &&
                doodleX > p.x - 10 && doodleX < p.x + p.w + 10 &&
                feet >= p.y && prevFeet <= p.y + 20) {
                if (p.type === 'break') {
                    p.broken = true; playSynth('hit'); resetCombo();
                    createParticle(p.x + p.w / 2, p.y + 7, '#a77b4f', 8, 420, 2.5);
                }
                else if (p.type === 'jetpack') {
                    doodleJetpackUntil = nowMs + DOODLE_JETPACK_DURATION; doodlePropUntil = 0;
                    playSynth('good'); createFloatingText(doodleX, doodleY, '🎒 ДЖЕТПАК!', '#f08a3c');
                } else if (p.type === 'propeller') {
                    doodlePropUntil = nowMs + DOODLE_PROPELLER_DURATION;
                    playSynth('good'); createFloatingText(doodleX, doodleY, '🧢 ПРОПЕЛЛЕР!', '#d9a400');
                } else if (p.type === 'boots') {
                    doodleBootsUntil = nowMs + DOODLE_BOOTS_DURATION;
                    doodleVy = DOODLE_JUMP_NORMAL * DOODLE_BOOTS_MULTIPLIER;
                    doodleSquash = 0.62; playSynth('good');
                    createFloatingText(doodleX, doodleY, '🥾 ПРУЖИНЫ 10с!', '#4a90d9');
                } else {
                    let base = p.type === 'coin' ? DOODLE_JUMP_COIN
                             : p.type === 'spring' ? DOODLE_JUMP_SPRING
                             : DOODLE_JUMP_NORMAL;
                    // Пружинные ботинки усиливают ЛЮБОЙ отскок, пока надеты
                    doodleVy = bootsOn ? base * DOODLE_BOOTS_MULTIPLIER : base;
                    doodleY = p.y - 16;   // ставим ровно на платформу (после «проскока» за кадр)
                    // Чем сильнее оттолкнулись — тем заметнее приплющило
                    doodleSquash = p.type === 'spring' ? 0.55 : (bootsOn ? 0.62 : 0.72);
                    playSynth('jump');
                    createDust(doodleX, p.y, color);
                    if (p.type === 'coin') {
                        bonusCoins += 1; bumpCombo(doodleX, doodleY - 20);
                        createFloatingText(doodleX, doodleY, `+coin${combo>=3 ? ' x'+combo : ''}`, '#d9a400');
                    } else if (p.type === 'spring') {
                        createFloatingText(doodleX, doodleY, 'БОИНГ!', '#4a90d9');
                    } else {
                        if (p.type === 'vanish') { p.gone = true; createParticle(p.x + p.w / 2, p.y + 7, '#b9b0a6', 8, 300, 2); }
                        resetCombo(); // приземлился на обычную платформу — цепочка монет прервалась
                    }
                }
            }
        }

        // --- Монстры ---
        for (let i = doodleMonsters.length - 1; i >= 0; i--) {
            const m = doodleMonsters[i];
            if (m.y > height + 80 || (m.dead && m.t > 1.4)) { doodleMonsters.splice(i, 1); continue; }
            if (!m.dead) {
                m.phase += m.speed * dt;
                m.x = m.bx + Math.sin(m.phase) * m.range;
                m.y = m.by + Math.sin(m.phase * 1.7) * m.bob;
            } else {
                m.t += dt;
                if (m.dead === 'knock') { m.vy += DOODLE_GRAVITY * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.rot += 9 * dt; }
                else if (m.t > 0.3) { m.vy += DOODLE_GRAVITY * dt; m.y += m.vy * dt; }
            }
            drawDoodleMonster(m);
            if (m.dead || doodleDead) continue;
            const hit = doodleSweepHit(prevX, prevY, doodleX, doodleY, m.x, m.y, m.r + 15);
            if (!hit) continue;
            if (flying) {
                // В полёте монстра просто сносит в сторону
                m.dead = 'knock'; m.t = 0; m.vx = (m.x < doodleX ? -1 : 1) * 280; m.vy = -320;
                doodleBonus += DOODLE_MONSTER_KNOCK_POINTS; doodleShake = Math.max(doodleShake, 5);
                playSynth('stomp'); haptic('light');
                createFloatingText(m.x, m.y - 20, `+${DOODLE_MONSTER_KNOCK_POINTS}`, '#d9a400');
            } else if (doodleVy > 0 && hit.y < m.y - m.r * 0.25) {
                // Сверху и в падении — растоптал!
                m.dead = 'stomp'; m.t = 0; m.vy = 0;
                doodleY = Math.min(hit.y, m.y - m.r - 4);
                doodleVy = DOODLE_JUMP_MONSTER; doodleSquash = 0.58;
                doodleBonus += DOODLE_MONSTER_POINTS;
                doodleShake = Math.max(doodleShake, 7); flashScreen('#ffffff', 0.16);
                playSynth('stomp'); haptic('medium');
                createParticle(m.x, m.y, m.color, 16, 560, 3);
                createFloatingText(m.x, m.y - 26, `💥 +${DOODLE_MONSTER_POINTS}`, '#d9a400');
            } else {
                doodleDie('monster', m.x, m.y);
            }
        }

        // --- Чёрные дыры ---
        for (let i = doodleHoles.length - 1; i >= 0; i--) {
            const h = doodleHoles[i];
            if (h.y > height + 80) { doodleHoles.splice(i, 1); continue; }
            h.rot += 2.6 * dt;
            drawDoodleHole(h);
            if (!doodleDead && !flying && doodleSweepHit(prevX, prevY, doodleX, doodleY, h.x, h.y, h.r + 6)) {
                doodleDie('hole', h.x, h.y);
            }
        }

        // Достраиваем путь вперёд, пока его верх ниже, чем DOODLE_SPAWN_AHEAD над экраном
        for (let guard = 0; guard < 40 && doodleChain.length &&
             doodleChain[doodleChain.length - 1].y > -DOODLE_SPAWN_AHEAD; guard++) doodleSpawnNext();

        if (!(doodleDead && doodleDead.kind === 'fall'))
            drawDoodler(doodleX, doodleY, doodleTilt, jetpackOn, doodleSquash, bootsOn, propOn, doodleScale);
        updateAndDrawParticles(dt);
        ctx.restore();   // конец тряски — подписи ниже не трясутся

        // Остаток действия бонусов — плашки над кнопкой «Завершить игру»
        if (bootsOn) drawBonusPill('Пружины', Math.max(0, (doodleBootsUntil - nowMs) / 1000),
                                   DOODLE_BOOTS_DURATION / 1000, '#4a90d9', height - 142);
        if (propOn) drawBonusPill('Пропеллер', Math.max(0, (doodlePropUntil - nowMs) / 1000),
                                  DOODLE_PROPELLER_DURATION / 1000, '#e5533d', height - (bootsOn ? 184 : 142));

        // Очки: высота / DOODLE_PX_PER_POINT + бонусы за монстров
        const newScore = Math.floor(doodleHeight / DOODLE_PX_PER_POINT) + doodleBonus;
        if (newScore !== score) { score = newScore; updateHud(); }

        if (!doodleDead && doodleY > height + 60) doodleDie('fall');
        if (doodleDead) {
            doodleDead.t += dt;
            const T = doodleDead.kind === 'hole' ? DOODLE_HOLE_SUCK_TIME
                    : doodleDead.kind === 'monster' ? DOODLE_DEATH_TIME : DOODLE_FALL_DEATH_TIME;
            if (doodleDead.t >= T) { gameOver(); return; }
        }

        gameReq = requestAnimationFrame(loopDoodleSafe);
    }
    const loopDoodleSafe = safeFrame(loopDoodle);

    // ===== ЗМЕЙКИ =====
    // На поле лежат неоновые змейки — изогнутые, на несколько клеток, со
    // стрелкой на голове. Тап по змейке — она ползёт головой вперёд, тело
    // тянется следом по её же изгибам. Путь головы до края свободен —
    // уползает с поля. Упёрлась в другую змейку — отдёргивается назад и
    // минус жизнь. Очистил поле — следующий уровень: больше и длиннее.
    //
    // Уровни ГАРАНТИРОВАННО решаемые: собираем их «задом наперёд» — каждую
    // новую змейку кладём только так, чтобы луч от её головы до края был
    // свободен от уже лежащих. Тело при движении проходит только по своим
    // же клеткам и этому лучу, а уход змейки лишь освобождает клетки, —
    // поэтому порядок, в котором уползают все, существует всегда.
    const ARR_VEC = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
    const ARR_COLOR = { U: '#4a90d9', D: '#f08a3c', L: '#d9579a', R: '#6aaa64' };
    const ARR_LIVES = 3;
    // Новые механики по уровням (чтобы игра не была однообразной):
    const ARR_LOCK_LEVEL = 3;      // «замороженные» змейки: ждут, пока уползут N других
    const ARR_ROCK_LEVEL = 4;      // камни: неподвижные клетки-препятствия
    const ARR_GOLD_LEVEL = 5;      // золотая змейка: бонус за неё
    const ARR_GOLD_BONUS = 30;
    const ARR_PERFECT_BASE = 20, ARR_PERFECT_PER_LEVEL = 5;   // бонус «без ошибок»
    const ARR_CLEAR_TIME = 1.6;    // с — праздник прохождения уровня, потом следующий
    const ARR_HINTS = {
        [ARR_LOCK_LEVEL]: '🔒 Новое: замороженная змейка — ждёт, пока уползут другие',
        [ARR_ROCK_LEVEL]: '🪨 Новое: камни — их не сдвинуть',
        [ARR_GOLD_LEVEL]: '⭐ Новое: золотая змейка — бонусные очки',
    };
    let arr = null;

    function genArrowsLevel(level) {
        const cols = Math.min(5 + Math.ceil(level / 2), 8);
        const rows = Math.min(6 + Math.ceil(level / 2), 10);
        const maxLen = Math.min(2 + Math.ceil(level / 2), 6);
        const fill = Math.min(0.5 + level * 0.03, 0.78);       // какую долю клеток занять
        const key = (c, r) => c + ',' + r;
        const inside = (c, r) => c >= 0 && c < cols && r >= 0 && r < rows;
        const occ = new Set(), snakes = [], rocks = [];
        let used = 0;
        // Камни кладём ДО змеек и считаем занятыми навсегда: луч головы
        // любой змейки проверяется на свободу от них при укладке, а камни
        // никогда не уходят — значит, гарантия решаемости сохраняется.
        if (level >= ARR_ROCK_LEVEL) {
            const nRocks = Math.min(1 + Math.floor((level - ARR_ROCK_LEVEL) / 2), 4);
            for (let tries = 0; rocks.length < nRocks && tries < 50; tries++) {
                const c = Math.floor(Math.random() * cols), r = Math.floor(Math.random() * rows);
                if (occ.has(key(c, r))) continue;
                occ.add(key(c, r)); rocks.push([c, r]);
            }
        }
        for (let tries = 0; tries < 1500 && used < cols * rows * fill; tries++) {
            const hc = Math.floor(Math.random() * cols), hr = Math.floor(Math.random() * rows);
            if (occ.has(key(hc, hr))) continue;
            for (const d of ['U', 'D', 'L', 'R'].sort(() => Math.random() - 0.5)) {
                const [dc, dr] = ARR_VEC[d];
                const ray = new Set(); let clear = true;
                for (let x = hc + dc, y = hr + dr; inside(x, y); x += dc, y += dr) {
                    if (occ.has(key(x, y))) { clear = false; break; }
                    ray.add(key(x, y));
                }
                if (!clear) continue;
                // Тело растёт от головы назад случайным блужданием с изгибами
                const want = 2 + Math.floor(Math.random() * (maxLen - 1));
                // Шея — строго позади головы: стрелка продолжает линию тела.
                // Раньше шея могла уйти вбок, и голова «смотрела» поперёк
                // змейки — выглядело как ошибка.
                const nc = hc - dc, nr = hr - dr;
                if (!inside(nc, nr) || occ.has(key(nc, nr))) continue;
                const cells = [[hc, hr], [nc, nr]], mine = new Set([key(hc, hr), key(nc, nr)]);
                while (cells.length < want) {
                    const [lc, lr] = cells[cells.length - 1];
                    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]]
                        .map(([a, b]) => [lc + a, lr + b])
                        .filter(([x, y]) => inside(x, y) && !occ.has(key(x, y)) && !mine.has(key(x, y)) && !ray.has(key(x, y)));
                    if (!opts.length) break;
                    // Чаще идём прямо — змейка выглядит естественнее, без «лесенок»
                    let next = opts[Math.floor(Math.random() * opts.length)];
                    if (cells.length >= 2) {
                        const [pc, pr] = cells[cells.length - 2];
                        const straight = opts.find(([x, y]) => x - lc === lc - pc && y - lr === lr - pr);
                        if (straight && Math.random() < 0.55) next = straight;
                    }
                    cells.push(next); mine.add(key(next[0], next[1]));
                }
                if (cells.length < 2) continue;
                cells.forEach(([x, y]) => occ.add(key(x, y)));
                used += cells.length;
                snakes.push({ cells, dir: d, state: 'idle', s: 0, v: 0, t: 0, appear: 0,
                              delay: snakes.length * 0.035, hit: 0, lock: 0, gold: false, shiver: 0 });
                break;
            }
        }
        // Замки. Порядок «последняя уложенная уползает первой» всегда
        // работает; в нём перед змейкой i уходят ровно n-1-i других. Замок
        // ≤ n-1-i к моменту её очереди гарантированно спадёт (каждая ушедшая
        // змейка снимает по единице со ВСЕХ замков) — решаемость сохраняется.
        const n = snakes.length;
        if (level >= ARR_LOCK_LEVEL && n >= 4) {
            const nLock = Math.min(1 + Math.floor((level - ARR_LOCK_LEVEL) / 3), 3);
            const cand = [];
            for (let i = 0; i < n; i++) if (n - 1 - i >= 2) cand.push(i);
            cand.sort(() => Math.random() - 0.5);
            for (let k = 0; k < nLock && k < cand.length; k++) {
                const i = cand[k], maxLock = Math.min(4, n - 1 - i);
                snakes[i].lock = 2 + Math.floor(Math.random() * (maxLock - 1));
            }
        }
        if (level >= ARR_GOLD_LEVEL) {
            const free = snakes.filter(s => !s.lock);
            if (free.length) free[Math.floor(Math.random() * free.length)].gold = true;
        }
        return { cols, rows, snakes, rocks };
    }

    function arrLayout() {
        const top = 92, bottom = 96;
        const cell = Math.floor(Math.min((width - 28) / arr.cols, (height - top - bottom) / arr.rows, 60));
        const ox = Math.round((width - cell * arr.cols) / 2);
        const oy = Math.round(top + ((height - top - bottom) - cell * arr.rows) / 2);
        return { cell, ox, oy };
    }

    function startArrows() {
        lives = ARR_LIVES;
        arr = { level: 1, banner: 1.2, levelStart: performance.now(), clearing: false,
                mistakes: 0, celebrate: null, hint: '', hintT: 0 };
        Object.assign(arr, genArrowsLevel(1));
        timeLeft = arr.level;  // в HUD-ячейке «уровень»
        document.getElementById('ui-time-box').style.display = 'flex';
        document.getElementById('ui-lives-box').style.display = 'flex';
        document.getElementById('btn-ingame-exit').style.display = 'block';
        canvas.style.display = 'block';
        gameReq = requestAnimationFrame(loopArrowsSafe);
    }

    // Следующий уровень (вызывается из игрового цикла после праздника)
    function nextArrowsLevel() {
        arr.level++;
        Object.assign(arr, genArrowsLevel(arr.level));
        arr.levelStart = performance.now(); arr.banner = 1.2; arr.clearing = false;
        arr.mistakes = 0; arr.celebrate = null;
        arr.hint = ARR_HINTS[arr.level] || ''; arr.hintT = arr.hint ? 3.2 : 0;
        timeLeft = arr.level; updateHud();
    }

    // Что стоит на луче головы и через сколько клеток (или null):
    // {snake, dist} — другая змейка, {rock: true, dist} — камень.
    function arrBlocker(sn) {
        const [dc, dr] = ARR_VEC[sn.dir];
        const [hc, hr] = sn.cells[0];
        const rocks = arr.rocks || [];
        for (let x = hc + dc, y = hr + dr, n = 1; x >= 0 && x < arr.cols && y >= 0 && y < arr.rows; x += dc, y += dr, n++) {
            const b = arr.snakes.find(q => q !== sn && q.state !== 'fly' && q.cells.some(([a, bb]) => a === x && bb === y));
            if (b) return { snake: b, dist: n };
            if (rocks.some(([a, bb]) => a === x && bb === y)) return { snake: null, rock: true, dist: n };
        }
        return null;
    }

    // Точка на «рельсе» змейки: хвост → ... → голова → дальше по лучу.
    // Сегмент i (0 = голова) при продвижении s стоит в точке (head + s - i).
    function snakePoint(sn, idx, L) {
        const n = sn.cells.length;            // индексы 0..n-1 — тело от хвоста к голове
        const [dc, dr] = ARR_VEC[sn.dir];
        let c, r;
        if (idx <= n - 1) {
            const i0 = Math.max(0, Math.floor(idx)), i1 = Math.min(n - 1, i0 + 1), f = idx - i0;
            const a = sn.cells[n - 1 - i0], b = sn.cells[n - 1 - i1];
            c = a[0] + (b[0] - a[0]) * f; r = a[1] + (b[1] - a[1]) * f;
        } else {
            const [hc, hr] = sn.cells[0], k = idx - (n - 1);
            c = hc + dc * k; r = hr + dr * k;
        }
        return [L.ox + (c + 0.5) * L.cell, L.oy + (r + 0.5) * L.cell];
    }

    function onArrowsTap(e) {
        if (!isPlaying || currentGame !== 'arrows' || !arr || arr.clearing) return;
        const rect = canvas.getBoundingClientRect();
        const pt = e.touches ? e.touches[0] : e;
        if (!pt) return;
        const px = pt.clientX - rect.left, py = pt.clientY - rect.top;
        const L = arrLayout();
        const c = Math.floor((px - L.ox) / L.cell), r = Math.floor((py - L.oy) / L.cell);
        const sn = arr.snakes.find(q => q.state === 'idle' && q.appear >= 1 && q.cells.some(([a, b]) => a === c && b === r));
        if (!sn) return;
        const [hx, hy] = snakePoint(sn, sn.cells.length - 1, L);
        if (sn.lock > 0) {
            // Замороженная: не штрафуем, только подсказываем, сколько ждать
            sn.shiver = 0.3; playSynth('jump');
            createFloatingText(hx, hy - 18, `🔒 ещё ${sn.lock}`, '#5d8fbf');
            return;
        }
        const block = arrBlocker(sn);
        if (block) {
            sn.state = 'bump'; sn.t = 0; sn.bumpDist = block.dist - 1 + 0.3;
            if (block.snake) block.snake.hit = 0.35;
            arr.mistakes++;
            lives = Math.max(0, lives - 1); resetCombo(); updateHud();
            playSynth('hit'); shakeScreen();
            createFloatingText(hx, hy - 18, block.rock ? 'КАМЕНЬ!' : 'ЗАНЯТО!', '#e5533d');
            if (lives <= 0) { arr.clearing = true; flashScreen('#e5533d', 0.4); setTimeout(gameOver, 650); }
        } else {
            sn.state = 'fly'; sn.v = 6; sn.s = 0;   // скорость в клетках/с, растёт
            bumpCombo(hx, hy - 20);
            let gain = Math.round((8 + sn.cells.length * 4) * comboMult());
            if (sn.gold) {
                gain += ARR_GOLD_BONUS;
                createConfetti(hx, hy, 14, 1.3); playSynth('big');
                createFloatingText(hx, hy - 42, `⭐ +${ARR_GOLD_BONUS}`, '#d9a400');
            }
            score += gain; updateHud();
            // Ушла змейка — со всех замков снимаем по единице
            arr.snakes.forEach(q => {
                if (q === sn || !(q.lock > 0)) return;
                q.lock--;
                if (q.lock === 0) {
                    const [qx, qy] = snakePoint(q, q.cells.length - 1, L);
                    createFloatingText(qx, qy - 16, '🔓', '#5d8fbf');
                    createParticle(qx, qy, '#5d8fbf', 10, 380, 2.5);
                }
            });
            playSynth('good');
            haptic('light');
        }
    }
    canvas.addEventListener('pointerdown', onArrowsTap);

    // Путь змейки: точки только в узлах (хвост, повороты, голова), а углы
    // скругляются дугами arcTo — тело выглядит как гибкая трубка, а не
    // как ломаная из отрезков.
    function snakePath(sn, L) {
        const n = sn.cells.length, head = (n - 1) + sn.s, tail = head - (n - 1);
        const pts = [snakePoint(sn, tail, L)];
        for (let k = Math.floor(tail) + 1; k < head - 1e-6; k++) pts.push(snakePoint(sn, k, L));
        pts.push(snakePoint(sn, head, L));
        return pts;
    }

    function traceSmooth(pts, radius) {
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let k = 1; k < pts.length - 1; k++) ctx.arcTo(pts[k][0], pts[k][1], pts[k + 1][0], pts[k + 1][1], radius);
        ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    }

    function drawSnake(sn, L, alpha, scale) {
        // Золотая — бонусная, ледяная — «замороженная» (ждёт, пока уползут другие)
        const col = sn.gold ? '#edc22e' : sn.lock > 0 ? '#a9bfd3' : ARR_COLOR[sn.dir];
        const red = sn.state === 'bump' || sn.hit > 0;
        const color = red ? '#e5533d' : col;
        const pts = snakePath(sn, L);
        const [hx, hy] = pts[pts.length - 1];
        const [dx, dy] = ARR_VEC[sn.dir];
        const w = L.cell * 0.22 * scale;
        const rad = L.cell * 0.42;
        // Голова: шея чуть продлевается вперёд, на конце — шеврон «>» из той же
        // трубки (две короткие дуги-крылышки с круглыми концами).
        const hs = L.cell * 0.25 * scale;
        const tip = [hx + dx * hs * 0.85, hy + dy * hs * 0.85];
        const wingL = [tip[0] - dx * hs + dy * hs * 0.9, tip[1] - dy * hs - dx * hs * 0.9];
        const wingR = [tip[0] - dx * hs - dy * hs * 0.9, tip[1] - dy * hs + dx * hs * 0.9];
        const body = pts.concat([[hx + dx * hs * 0.55, hy + dy * hs * 0.55]]);
        const chevron = () => { ctx.beginPath(); ctx.moveTo(wingL[0], wingL[1]); ctx.lineTo(tip[0], tip[1]); ctx.lineTo(wingR[0], wingR[1]); };

        ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (sn.shiver > 0) ctx.translate(Math.sin(sn.shiver * 70) * 4 * (sn.shiver / 0.3), 0);  // «дрожь» замороженной
        // 1) тёмный контур трубки
        const edge = shadeColor(color, -0.3);
        ctx.strokeStyle = edge;
        ctx.lineWidth = w + 4.5; traceSmooth(body, rad); ctx.stroke();
        ctx.lineWidth = w * 0.8 + 4.5; chevron(); ctx.stroke();
        // 2) сама трубка — плоский цвет
        ctx.strokeStyle = color;
        ctx.lineWidth = w; traceSmooth(body, rad); ctx.stroke();
        ctx.lineWidth = w * 0.8; chevron(); ctx.stroke();
        // 3) светлый блик по центру — даёт объём
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1.5, w * 0.22);
        traceSmooth(body, rad); ctx.stroke();
        // 4) кончик головы
        ctx.fillStyle = edge;
        ctx.beginPath(); ctx.arc(tip[0], tip[1], Math.max(2, w * 0.2), 0, Math.PI * 2); ctx.fill();
        // 5) значок: звезда у золотой, замок с числом — у замороженной
        if (sn.gold && pts.length) {
            const mp = pts[Math.floor((pts.length - 1) / 2)] || pts[0];
            const br = Math.max(8, L.cell * 0.2);
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c99a1e'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mp[0], mp[1], br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#d4a017'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `bold ${Math.round(br * 1.5)}px Arial, sans-serif`;
            ctx.fillText('★', mp[0], mp[1] + 1);
            ctx.textBaseline = 'alphabetic';
        }
        if (sn.lock > 0 && pts.length) {
            const mp = pts[Math.floor((pts.length - 1) / 2)] || pts[0];
            const br = Math.max(8, L.cell * 0.2);
            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#7f98ae'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mp[0], mp[1], br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#5d7489'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `bold ${Math.round(br * 1.2)}px ` + UI_FONT;
            ctx.fillText(String(sn.lock), mp[0], mp[1] + 1);
            ctx.textBaseline = 'alphabetic';
        }
        ctx.restore();
    }

    // Камень: неровный восьмиугольник с трещиной
    function drawRock(x, y, cell) {
        const cx = x + cell / 2, cy = y + cell / 2, R = cell / 2 - cell * 0.12;
        ctx.save();
        ctx.fillStyle = '#cdc1b4'; ctx.strokeStyle = '#a39383'; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4 + 0.3, rr = R * (i % 2 ? 0.84 : 1);
            ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(119,110,101,0.55)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(cx - R * 0.4, cy - R * 0.2); ctx.lineTo(cx, cy + R * 0.1); ctx.lineTo(cx + R * 0.3, cy - R * 0.35); ctx.stroke();
        ctx.restore();
    }

    // Уровень пройден: бонусы, звёзды, конфетти. Следующий уровень
    // включает игровой цикл через ARR_CLEAR_TIME секунд (по dt, не таймером).
    function startArrowsCelebration() {
        arr.clearing = true;
        const secs = (performance.now() - arr.levelStart) / 1000;
        const par = 5 + arr.level * 3;
        const base = 50 + 25 * arr.level;
        const speed = Math.max(0, Math.round((par - secs) * 4));
        const perfect = arr.mistakes === 0 ? ARR_PERFECT_BASE + ARR_PERFECT_PER_LEVEL * arr.level : 0;
        const stars = (arr.mistakes === 0 && secs <= par) ? 3 : (arr.mistakes <= 1 && secs <= par * 1.6) ? 2 : 1;
        score += base + speed + perfect;
        const lines = [`+${base} за уровень`];
        if (speed) lines.push(`+${speed} за скорость`);
        if (perfect) lines.push(`+${perfect} без ошибок`);
        if (perfect && lives < ARR_LIVES) { lives++; lines.push('❤️ +1 жизнь'); }
        updateHud();
        arr.celebrate = { t: 0, stars, lines };
        createConfetti(width * 0.15, height * 0.92, 26, 0.6);
        createConfetti(width * 0.85, height * 0.92, 26, 0.6);
        flashScreen('#6aaa64', 0.22); playSynth('big'); haptic('medium');
    }

    function drawArrowsCelebration(L) {
        const c = arr.celebrate, t = c.t;
        const cy = L.oy + L.cell * arr.rows / 2 - 40;
        const x = Math.min(1, t / 0.25);
        const sc = 0.6 + 0.4 * (1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2));  // easeOutBack
        const fade = Math.max(0, Math.min(1, (ARR_CLEAR_TIME - t) / 0.3));
        ctx.save(); ctx.globalAlpha = fade;
        ctx.fillStyle = 'rgba(250,248,239,0.92)'; ctx.fillRect(0, cy - 60, width, 190);
        ctx.translate(width / 2, cy); ctx.scale(sc, sc); ctx.textAlign = 'center';
        ctx.fillStyle = '#776e65';
        ctx.font = 'bold 26px ' + UI_FONT;
        ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', 0, -14);
        // Звёзды выскакивают по одной
        for (let i = 0; i < 3; i++) {
            const st = t - 0.25 - i * 0.18;
            if (st < 0) continue;
            const k = Math.min(1, st / 0.2);
            ctx.fillStyle = i < c.stars ? '#edc22e' : '#e0d6ca';
            ctx.font = `bold ${Math.round(34 * (1.5 - 0.5 * k))}px Arial, sans-serif`;
            ctx.fillText('★', (i - 1) * 44, 30);
        }
        ctx.fillStyle = '#8f7a66';
        ctx.font = 'bold 16px ' + UI_FONT;
        c.lines.forEach((ln, i) => { if (t > 0.5 + i * 0.12) ctx.fillText(ln, 0, 62 + i * 19); });
        ctx.restore();
    }

    function loopArrows(time) {
        if (!isPlaying) return;
        let dt = (time - lastTime) / 1000; lastTime = time; if (dt > 0.1) dt = 0.1; if (!(dt > 0)) dt = 0;
        ctx.clearRect(0, 0, width, height); drawBackground(dt);
        const L = arrLayout();

        // Поле — белая карточка с мягкой тенью
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#efe7dc'; ctx.lineWidth = 1.5;
        ctx.save(); ctx.shadowColor = 'rgba(119,110,101,0.14)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
        ctx.beginPath(); ctx.roundRect(L.ox - 10, L.oy - 10, L.cell * arr.cols + 20, L.cell * arr.rows + 20, 24); ctx.fill();
        ctx.restore(); ctx.stroke();
        ctx.fillStyle = 'rgba(119,110,101,0.22)';
        for (let r = 0; r < arr.rows; r++) for (let c = 0; c < arr.cols; c++) {
            ctx.beginPath(); ctx.arc(L.ox + (c + 0.5) * L.cell, L.oy + (r + 0.5) * L.cell, 1.6, 0, Math.PI * 2); ctx.fill();
        }
        for (const rk of (arr.rocks || [])) drawRock(L.ox + rk[0] * L.cell, L.oy + rk[1] * L.cell, L.cell);

        const far = Math.max(arr.cols, arr.rows) + 8;   // столько клеток — и змейка точно за экраном
        for (let i = arr.snakes.length - 1; i >= 0; i--) {
            const sn = arr.snakes[i];
            if (sn.appear < 1) { sn.delay -= dt; if (sn.delay <= 0) sn.appear = Math.min(1, sn.appear + dt * 4); }
            if (sn.hit) sn.hit = Math.max(0, sn.hit - dt);
            if (sn.shiver) sn.shiver = Math.max(0, sn.shiver - dt);
            if (sn.state === 'fly') {
                sn.v += 34 * dt; sn.s += sn.v * dt;
                if (sn.s - sn.cells.length > far) { arr.snakes.splice(i, 1); continue; }
            } else if (sn.state === 'bump') {
                sn.t += dt; const T = 0.34, k = Math.min(1, sn.t / T);
                sn.s = sn.bumpDist * Math.sin(k * Math.PI);   // туда и обратно одной дугой
                if (k >= 1) { sn.state = 'idle'; sn.s = 0; }
            }
            // Золотая искрит, пока лежит
            if (sn.gold && sn.state === 'idle' && sn.appear >= 1 && Math.random() < dt * 5 && sn.cells.length > 1) {
                const [gx, gy] = snakePoint(sn, Math.random() * (sn.cells.length - 1), L);
                particles.push({ x: gx, y: gy, vx: 0, vy: -35, life: 0.7, color: '#d9a400', size: 2, g: 0 });
            }
            const a = sn.appear;
            const sc = a <= 0 ? 0 : 1 + 2.2 * Math.pow(a - 1, 3) + 1.2 * Math.pow(a - 1, 2);  // easeOutBack
            if (sc <= 0) continue;
            drawSnake(sn, L, Math.min(1, a * 1.5), sc);
        }

        if (!arr.clearing && arr.snakes.length === 0) startArrowsCelebration();

        if (arr.banner > 0) {
            arr.banner -= dt;
            ctx.globalAlpha = Math.max(0, Math.min(1, arr.banner * 2.5));
            ctx.fillStyle = '#776e65';
            ctx.font = 'bold 26px ' + UI_FONT; ctx.textAlign = 'center';
            ctx.fillText(`УРОВЕНЬ ${arr.level}`, width / 2, L.oy - 22);
            ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
        // Подсказка про новую механику — на уровне, где она появляется впервые
        if (arr.hintT > 0 && arr.hint) {
            arr.hintT -= dt;
            const parts = arr.hint.split(' — ');
            ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, arr.hintT * 2));
            ctx.fillStyle = 'rgba(143,122,102,0.95)';
            ctx.beginPath(); ctx.roundRect(14, L.oy + 6, width - 28, 22 + parts.length * 18, 10); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
            ctx.font = 'bold 15px ' + UI_FONT;
            parts.forEach((ln, i) => ctx.fillText(i ? ln : ln, width / 2, L.oy + 26 + i * 18));
            ctx.restore();
        }

        updateAndDrawParticles(dt);
        if (arr.celebrate) {
            arr.celebrate.t += dt;
            drawArrowsCelebration(L);
            if (arr.celebrate.t >= ARR_CLEAR_TIME) nextArrowsLevel();
        }

}

function trayCenter(i) { return { x: boardX + slotW * (i + 0.5), y: trayY + trayH / 2 }; }
function trayPos(i, now) {
    const p = tray[i], c0 = trayCenter(i), a = p.anim;
    if (!a) return { x: c0.x, y: c0.y, s: trayCell };
    const t = (now - a.t0) / (a.type === 'in' ? 300 : 150);
    if (t >= 1) { p.anim = null; return { x: c0.x, y: c0.y, s: trayCell }; }
    if (a.type === 'in') {
        if (t < 0) return { x: c0.x + W, y: c0.y, s: trayCell };
        return { x: c0.x + (1 - easeOutBack(t)) * W * 0.6, y: c0.y, s: trayCell };
    }
    const e = easeOutCubic(Math.max(0, t));
    return { x: lerp(a.x, c0.x, e), y: lerp(a.y, c0.y, e), s: lerp(a.s, trayCell, e) };
}
function dragTarget(d) { return { x: d.px, y: d.py }; }
function dragRender(d, now) {
    const k = easeOutCubic(clamp((now - d.t0) / 70, 0, 1));
    const t = dragTarget(d);
    return { x: lerp(d.fx, t.x, k), y: lerp(d.fy, t.y, k), s: lerp(d.fs, cell, k) };
}

function drawGrid(now) {
    const prev = drag && drag.snap ? drag.snap.clearSet : null;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const v = grid[r][c];
        if (!v) continue;
        const k = r * N + c;
        let key = v - 1;
        if (prev && prev.has(k)) key = drag.p.color;
        if (grayStart && now >= grayStart + k * 14) key = 'g';
        let s = cell;
        const pt = popAt.get(k);
        if (pt !== undefined) {
            const t = (now - pt) / 200;
            if (t >= 1) popAt.delete(k); else s = cell * (1 + 0.10 * Math.sin(Math.PI * Math.max(0, t)));
        }
        const x = boardX + c * cell, y = boardY + r * cell;
        drawBlock(key, x - (s - cell) / 2, y - (s - cell) / 2, s);
    }
}
function drawGhost(now) {
    if (!drag || !drag.snap) return;
    const sn = drag.snap, sh = drag.p.sh;
    for (const [dr, dc] of sh.cells) {
        const R = sn.r + dr, C = sn.c + dc;
        ctx.globalAlpha = sn.clearSet.has(R * N + C) ? 1 : 0.42;
        drawBlock(drag.p.color, boardX + C * cell, boardY + R * cell, cell);
    }
    ctx.globalAlpha = 1;
    if (sn.clearSet.size) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.10 + 0.08 * Math.sin(now / 110)) + ')';
        for (const k of sn.clearSet) ctx.fillRect(boardX + (k % N) * cell, boardY + Math.floor(k / N) * cell, cell, cell);
    }
}
const DIE_MS = 340;
function drawDying(now) {
    dying = dying.filter(d => {
        const t = (now - d.t0 - d.delay) / DIE_MS;
        const x = boardX + d.c * cell, y = boardY + d.r * cell;
        if (t < 0) { drawBlock(d.color, x, y, cell); return true; }
        if (t >= 1) return false;
        if (!d.burst && t > 0.22) { d.burst = true; burst(x + cell / 2, y + cell / 2, d.color); }
        let s, a = 1, flash;
        if (t < 0.22) { const u = t / 0.22; s = 1 + 0.16 * u; flash = 0.55 * u; }
        else { const u = (t - 0.22) / 0.78; s = 1.16 * (1 - u * u); a = 1 - u * 0.5; flash = 0.55 * (1 - u); }
        const ss = cell * s, ox = x + (cell - ss) / 2, oy = y + (cell - ss) / 2;
        ctx.globalAlpha = a; drawBlock(d.color, ox, oy, ss);
        ctx.fillStyle = 'rgba(255,255,255,' + flash + ')'; ctx.fillRect(ox, oy, ss, ss);
        ctx.globalAlpha = 1;
        return true;
    });
}
function burst(x, y, color) {
    const n = reduced ? 2 : 6, now = performance.now();
    for (let k = 0; k < n; k++) {
        const ang = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 220;
        particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 140, s: cell * (0.12 + Math.random() * 0.14),
            color, t0: now, life: 450 + Math.random() * 350, rot: Math.random() * 6, vr: (Math.random() * 2 - 1) * 10 });
    }
}
function drawParticles(dt, now) {
    particles = particles.filter(p => {
        const k = (now - p.t0) / p.life;
        if (k >= 1) return false;
        p.vy += 1100 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const s = p.s * (1 - k * 0.4);
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = PALETTE[p.color]; ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(-s / 2, -s / 2, s, s * 0.3);
        ctx.restore();
        return true;
    });
}
function addText(str, x, y, size, fill, stroke, dur, rise, delay) {
    texts.push({ str, x, y, size, fill, stroke, dur, rise, t0: performance.now() + (delay || 0) });
}
function drawTexts(now) {
    texts = texts.filter(t => {
        const k = (now - t.t0) / t.dur;
        if (k < 0) return true;
        if (k >= 1) return false;
        const pop = Math.max(0.01, k < 0.16 ? easeOutBack(k / 0.16) : 1);
        ctx.save();
        ctx.globalAlpha = clamp(k > 0.72 ? 1 - (k - 0.72) / 0.28 : 1, 0, 1);
        ctx.translate(t.x, t.y - t.rise * easeOutCubic(k));
        ctx.scale(pop, pop);
        ctx.font = '900 ' + Math.round(t.size) + 'px ' + FONT;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
        const maxW = boardSize * 0.96;
        ctx.lineWidth = t.size * 0.2; ctx.strokeStyle = t.stroke; ctx.strokeText(t.str, 0, 0, maxW);
        ctx.fillStyle = t.fill; ctx.fillText(t.str, 0, 0, maxW);
        ctx.restore();
        return true;
    });
}
function drawTray(now) {
    for (let i = 0; i < 3; i++) {
        const p = tray[i];
        if (!p || (drag && drag.i === i)) continue;
        const q = trayPos(i, now);
        drawPiece(p.sh, fitFlags[i] && !grayStart ? p.color : 'g', q.x, q.y, q.s, false);
    }
}
function shake(amp, dur) { shakeAmp = amp; shakeDur = dur; shakeUntil = performance.now() + dur; }

let last = 0;
function frame(now) {
    if (!active) return;
    try {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        if (now < shakeUntil) {
            const a = shakeAmp * (shakeUntil - now) / shakeDur;
            ctx.translate((Math.random() * 2 - 1) * a, (Math.random() * 2 - 1) * a);
        }
        if (boardCanvas) ctx.drawImage(boardCanvas, boardX - FRAME, boardY - FRAME, boardSize + FRAME * 2, boardSize + FRAME * 2);
        drawGrid(now);
        drawGhost(now);
        drawDying(now);
        drawTray(now);
        if (drag) { const q = dragRender(drag, now); drawPiece(drag.p.sh, drag.p.color, q.x, q.y, q.s, true); }
        drawParticles(dt, now);
        drawTexts(now);
        tickScore();
    } catch (e) { console.error('[кубики]', e); }
    raf = requestAnimationFrame(frame);
}
function tickScore() {
    if (shown === score) return;
    const diff = score - shown;
    shown += Math.sign(diff) * Math.max(1, Math.ceil(Math.abs(diff) * 0.12));
    if ((diff > 0 && shown > score) || (diff < 0 && shown < score)) shown = score;
    scoreEl.textContent = fmt(shown);
}

/* ================= ход ================= */
const PRAISE = ['', '', 'Здорово!', 'Отлично!', 'Потрясающе!'];
function place(i, r, c) {
    const p = tray[i], sh = p.sh;
    tray[i] = null;
    const now = performance.now();
    for (const [dr, dc] of sh.cells) { grid[r + dr][c + dc] = p.color + 1; popAt.set((r + dr) * N + (c + dc), now); }
    moves++;
    let gained = sh.n;
    const fl = fullLines(grid);
    const L = fl.rows.length + fl.cols.length;
    sfx.place();
    if (L) {
        combo++; sinceClear = 0;
        const cells = new Map();
        for (const k of fl.rows) for (let j = 0; j < N; j++) cells.set(k * N + j, grid[k][j]);
        for (const k of fl.cols) for (let j = 0; j < N; j++) cells.set(j * N + k, grid[j][k]);
        const pr = r + (sh.h - 1) / 2, pc = c + (sh.w - 1) / 2;
        let sx = 0, sy = 0;
        cells.forEach((v, k) => {
            const rr = Math.floor(k / N), cc = k % N;
            sx += cc; sy += rr;
            dying.push({ r: rr, c: cc, color: v - 1, t0: now, delay: 40 + (Math.abs(rr - pr) + Math.abs(cc - pc)) * 24, burst: false });
            grid[rr][cc] = 0; popAt.delete(k);
        });
        const pts = Math.round(cells.size * L * (1 + (combo - 1) * 0.5)) * 10;
        gained += pts;
        const mx = clamp(boardX + (sx / cells.size + 0.5) * cell, boardX + cell * 1.3, boardX + boardSize - cell * 1.3);
        const my = boardY + (sy / cells.size + 0.5) * cell;
        addText('+' + fmt(pts), mx, my, cell * 0.62, '#ffffff', '#1d2a78', 900, cell * 0.9);
        const midX = boardX + boardSize / 2, midY = boardY + boardSize * 0.40;
        const word = L >= 5 ? 'Невероятно!' : PRAISE[L];
        if (word) addText(word, midX, midY, cell * 0.95, '#ffffff', '#1d2a78', 1100, cell * 0.5, 80);
        if (combo >= 2) addText('Комбо ' + combo, midX, midY + (word ? cell * 0.95 : 0), cell * 0.7, '#ffd23f', '#7a3c00', 1000, cell * 0.5, word ? 160 : 60);
        sfx.clear(L, combo);
        if (L >= 2 && !reduced) shake(L >= 3 ? cell * 0.12 : cell * 0.06, 260);
        if (grid.every(row => row.every(v => !v))) {
            gained += 300;
            addText('Поле чистое! +300', midX, midY + cell * 1.9, cell * 0.6, '#b4f59a', '#1f5a12', 1400, cell * 0.5, 260);
        }
        hapt(L >= 2 ? 'heavy' : 'medium');
    } else {
        sinceClear++;
        if (sinceClear >= 3) combo = 0;
        hapt('light');
    }
    score += gained;
    if (tray.every(x => !x)) refill(); else updateFits();
    updateHud();
    checkOver();
    save();
}
function refill() {
    const set = makeSet();
    rounds++;
    const now = performance.now();
    set.forEach((p, i) => { p.anim = reduced ? null : { type: 'in', t0: now + i * 50 }; });
    tray = set;
    updateFits();
}
function updateFits() { fitFlags = tray.map(p => !!p && canPlaceAnywhere(grid, p.sh)); }
function updateHud() {
    if (score > best) {
        best = score;
        bestEl.textContent = fmt(best);
        crownEl.classList.remove('bk-pulse'); void crownEl.getBoundingClientRect(); crownEl.classList.add('bk-pulse');
        if (!recordToasted && bestAtStart > 0) { recordToasted = true; toast('Новый рекорд!', 1600); }
    }
    const li = levelInfo();
    if (li.lv > level) {
        level = li.lv;
        if (moves > 0) { toast('Уровень ' + level + ' · фигуры сложнее', 1900); sfx.level(); }
    }
    lvlText.textContent = 'Уровень ' + level;
    lvlBar.style.width = (level >= 10 ? 100 : Math.round(li.frac * 100)) + '%';
    try { opts.onScore(score); } catch (e) { console.error(e); }
}
function checkOver() {
    if (over) return;
    if (tray.some((p, i) => p && fitFlags[i])) return;
    over = true;
    clearState();
    grayStart = performance.now() + 450;
    sfx.over(); hapt('heavy');
    clearTimeout(overTimer);
    // Сначала поле красиво «гаснет», потом — экран итогов хаба
    overTimer = setTimeout(() => { if (active) opts.onOver(score); }, 450 + N * N * 14 + 500);
}
function newGame() {
    clearTimeout(overTimer);
    grid = startBoard();
    score = 0; shown = 0; combo = 0; sinceClear = 0; rounds = 0; moves = 0; level = 1;
    over = false; grayStart = 0; recordToasted = false; drag = null;
    dying = []; particles = []; texts = []; popAt.clear();
    scoreEl.textContent = '0';
    refill();
    updateHud();
    checkOver();
    save();
    toast('Тащи фигуры на поле — полный ряд или столбец исчезает', 3200);
}

/* ================= недоигранная партия ================= */
function serialize() {
    return { grid, tray: tray.map(p => p ? { s: p.sh.id, c: p.color } : null),
        score, combo, sinceClear, rounds, moves, level };
}
function save() {
    if (!active || over) return;
    try { localStorage.setItem(STATE_KEY, JSON.stringify(serialize())); } catch (e) {}
}
function clearState() { try { localStorage.removeItem(STATE_KEY); } catch (e) {} }
function restore() {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || !Array.isArray(o.grid) || o.grid.length !== N || !Array.isArray(o.tray)) return false;
    const g = o.grid.map(row => Array.from({ length: N }, (_, j) => {
        const v = Array.isArray(row) ? (row[j] | 0) : 0;
        return v >= 0 && v <= PALETTE.length ? v : 0;
    }));
    const t = [0, 1, 2].map(k => {
        const x = o.tray[k];
        return x && SHAPES[x.s] ? { sh: SHAPES[x.s], color: Math.abs(x.c | 0) % PALETTE.length, anim: null } : null;
    });
    if (t.every(x => !x)) return false;
    grid = g; tray = t;
    score = Math.max(0, o.score | 0); combo = o.combo | 0; sinceClear = o.sinceClear | 0;
    rounds = o.rounds | 0; moves = o.moves | 0; level = clamp((o.level | 0) || 1, 1, 10);
    over = false; grayStart = 0; recordToasted = false; drag = null;
    dying = []; particles = []; texts = []; popAt.clear();
    return true;
}

/* ================= окна и тост ================= */
let toastTimer = 0;
function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('bk-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('bk-show'), ms || 1800);
}
function closeModal() { modal.hidden = true; modalOpen = false; modal.innerHTML = ''; }
function askExit() {
    if (!active || modalOpen || over) return;
    if (drag) { drop(true); }
    modal.innerHTML = '<div class="bk-card" role="dialog" aria-modal="true">' +
        '<h2>Завершить игру?</h2>' +
        '<p>Результат ' + fmt(score) + ' ' + plural(score, ['очко', 'очка', 'очков']) + ' пойдёт в рекорд.</p>' +
        '<div class="bk-actions">' +
        '<button class="bk-btn bk-alt" id="bk-no" type="button">Играть дальше</button>' +
        '<button class="bk-btn" id="bk-yes" type="button">Завершить</button></div></div>';
    modal.hidden = false; modalOpen = true;
    $('bk-no').addEventListener('click', closeModal);
    $('bk-yes').addEventListener('click', () => {
        closeModal(); over = true; clearState(); clearTimeout(overTimer);
        opts.onOver(score);
    });
    $('bk-yes').focus();
}

/* ================= управление ================= */
function local(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function slotAt(x, y) {
    if (y < trayY - cell * 0.4 || y > trayY + trayH + cell * 0.6) return -1;
    const i = Math.floor((x - boardX) / slotW);
    return i >= 0 && i < 3 ? i : -1;
}
/* Фигура едет быстрее пальца, и тем быстрее, чем резче ведёшь (как ускорение мыши).
   Медленно — почти 1:1, чтобы точно попасть в дыру; резкий взмах — до ×2,4 (мышь до ×2). */
function moveDrag(dx, dy, ts) {
    const d = drag;
    const dt = Math.max(4, (ts - d.lt) || 16);
    d.lt = ts;
    const v = Math.hypot(dx, dy) / dt;                 // пикселей за мс
    d.vs = d.vs * 0.5 + v * 0.5;                       // сглаживаем, чтобы не дёргалось
    const k0 = d.touch ? [0.15, 1.3, 1.15, 2.4] : [0.35, 2.0, 1.0, 2.0];
    const k = clamp((d.vs - k0[0]) / (k0[1] - k0[0]), 0, 1);
    const gain = k0[2] + (k0[3] - k0[2]) * k * k * (3 - 2 * k);
    const sh = d.p.sh;
    d.px = clamp(d.px + dx * gain, sh.w * cell * 0.25, W - sh.w * cell * 0.25);
    d.py = clamp(d.py + dy * gain, sh.h * cell * 0.25, H - sh.h * cell * 0.25);
}
function updateDrag() {
    const d = drag, sh = d.p.sh, t = dragTarget(d);
    const fx = (t.x - sh.w * cell / 2 - boardX) / cell, fy = (t.y - sh.h * cell / 2 - boardY) / cell;
    let bestP = null, bd = 1e9;
    for (const r of [Math.floor(fy), Math.ceil(fy)]) for (const c of [Math.floor(fx), Math.ceil(fx)]) {
        if (!fits(grid, sh, r, c)) continue;
        const dd = Math.hypot(r - fy, c - fx);
        if (dd < bd) { bd = dd; bestP = { r, c }; }
    }
    if (!bestP || bd > 0.78) { d.snap = null; return; }
    if (d.snap && d.snap.r === bestP.r && d.snap.c === bestP.c) return;
    const res = applyPlacement(grid, sh, bestP.r, bestP.c, 1);
    const set = new Set();
    res.rows.forEach(r => { for (let j = 0; j < N; j++) set.add(r * N + j); });
    res.cols.forEach(c => { for (let j = 0; j < N; j++) set.add(j * N + c); });
    d.snap = { r: bestP.r, c: bestP.c, clearSet: set };
}
function drop(cancel) {
    const d = drag;
    drag = null;
    canvas.style.cursor = '';
    if (!cancel && d.snap) { place(d.i, d.snap.r, d.snap.c); return; }
    const now = performance.now(), q = dragRender(d, now);
    if (tray[d.i]) tray[d.i].anim = { type: 'back', t0: now, x: q.x, y: q.y, s: q.s };
    sfx.back();
}
canvas.addEventListener('pointerdown', e => {
    if (!active || drag || over || modalOpen) return;
    const l = local(e);
    const i = slotAt(l.x, l.y);
    if (i < 0 || !tray[i]) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const now = performance.now(), q = trayPos(i, now);
    tray[i].anim = null;
    const touch = e.pointerType !== 'mouse';
    const lift = touch ? tray[i].sh.h * cell / 2 + cell * 0.9 : cell * 0.1;
    drag = { i, p: tray[i], x: l.x, y: l.y, px: l.x, py: l.y - lift, lt: e.timeStamp, vs: 0,
        fx: q.x, fy: q.y, fs: q.s, t0: now, touch, id: e.pointerId, snap: null };
    canvas.style.cursor = 'grabbing';
    sfx.pick(); hapt('light');
    updateDrag();
});
canvas.addEventListener('pointermove', e => {
    if (drag) {
        if (e.pointerId !== drag.id) return;
        const l = local(e);
        moveDrag(l.x - drag.x, l.y - drag.y, e.timeStamp);
        drag.x = l.x; drag.y = l.y;
        updateDrag();
        return;
    }
    if (e.pointerType === 'mouse') {
        const l = local(e), i = slotAt(l.x, l.y);
        canvas.style.cursor = active && !over && !modalOpen && i >= 0 && tray[i] ? 'grab' : '';
    }
});
canvas.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drop(false); });
canvas.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) drop(true); });
window.addEventListener('blur', () => { if (drag) drop(true); });

function renderSoundBtn() {
    btnSound.innerHTML = muted ? ICON_MUTE : ICON_SOUND;
    btnSound.setAttribute('aria-pressed', String(!muted));
    btnSound.setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
}
btnSound.addEventListener('click', () => {
    muted = !muted; renderSoundBtn();
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    if (!muted) sfx.pick();
});
btnExit.addEventListener('click', askExit);
document.addEventListener('keydown', e => { if (active && e.key === 'Escape' && modalOpen) closeModal(); });
document.addEventListener('visibilitychange', save);
if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { if (active) layout(); });
    ro.observe(stage); ro.observe(hud);
}
window.addEventListener('resize', () => { if (active) layout(); });

/* ================= связь с хабом ================= */
function start(o) {
    opts = Object.assign({ onScore() {}, onOver() {}, haptic() {} }, o || {});
    best = Math.max(0, (opts.best | 0));
    try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { muted = false; }
    renderSoundBtn();
    closeModal();
    root.hidden = false;
    active = true;
    layout();
    if (restore()) {
        if (score > best) best = score;
        bestAtStart = best;
        bestEl.textContent = fmt(best);
        updateFits();
        shown = score; scoreEl.textContent = fmt(score);
        updateHud();
        toast('Продолжаем партию', 1600);
        checkOver();
    } else {
        bestAtStart = best;
        bestEl.textContent = fmt(best);
        newGame();
    }
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(t => { last = t; frame(t); });
}
function stop() {
    save();
    active = false;
    cancelAnimationFrame(raf);
    clearTimeout(overTimer);
    if (drag) drag = null;
    closeModal();
    toastEl.classList.remove('bk-show');
    root.hidden = true;
}
return { start, stop };
})();
</script>
</body>
