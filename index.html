<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avito Radar — игры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');

        /* Светлая «дорогая» тема: палитра оригинального 2048, мягкий круглый
           шрифт, большие скругления, объёмные кнопки и мягкие тени. */
        :root {
            --bg: #faf8ef; --ink: #776e65; --ink-soft: #a0968c; --line: #ece4d9;
            --card: #ffffff; --board: #bbada0; --board-dark: #a39383;
            --btn: #8f7a66; --btn-dark: #6f5d4d; --btn2: #cbbfb3; --btn2-dark: #ab9e91;
            --exit: #f67c5f; --exit-dark: #d4593c; --accent: #f65e3b;
            --green: #6aaa64; --blue: #4a90d9; --gold: #edc22e;
            --shadow: 0 12px 32px rgba(119, 110, 101, 0.13), 0 2px 6px rgba(119, 110, 101, 0.06);
            --font: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: var(--ink);
            font-family: var(--font);
            overflow: hidden; touch-action: none; user-select: none;
        }

        .glass-panel { background: var(--card); border: none; box-shadow: var(--shadow); }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        .active { display: flex; }

        .menu-box {
            width: 90%; max-width: 400px; padding: 26px 20px 20px;
            border-radius: 28px; text-align: center;
        }
        .kicker { font-size: 12px; font-weight: 800; letter-spacing: 2.5px; color: var(--ink-soft);
                  text-transform: uppercase; margin-bottom: 2px; }
        h1 { margin: 0 0 6px 0; font-size: 34px; font-weight: 900; color: var(--ink); letter-spacing: -0.3px; }
        p { color: var(--ink-soft); font-size: 15px; font-weight: 700; margin: 0 0 18px; line-height: 1.35; }

        /* Объёмные кнопки: нажатие «вдавливает» кнопку (класс старый — его
           используют и скрипты) */
        .btn-neon {
            background: var(--btn); color: #fff; font-family: inherit; font-size: 17px; font-weight: 800;
            padding: 14px 16px; border-radius: 16px; border: none; box-shadow: 0 5px 0 var(--btn-dark);
            cursor: pointer; position: relative; margin: 0 0 14px; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .btn-neon:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-dark); }
        .btn-secondary { background: var(--btn2); box-shadow: 0 5px 0 var(--btn2-dark); }
        .btn-secondary:active { box-shadow: 0 1px 0 var(--btn2-dark); }
        .btn-exit { background: var(--exit); box-shadow: 0 5px 0 var(--exit-dark); }
        .btn-exit:active { box-shadow: 0 1px 0 var(--exit-dark); }
        #btn-ingame-exit:active { transform: translateX(-50%) translateY(4px) !important; }
        .menu-icon { width: 22px; height: 22px; flex-shrink: 0; }

        /* Карточки игр в меню */
        .game-card {
            width: 100%; display: flex; align-items: center; gap: 14px; padding: 11px 14px 11px 11px;
            margin: 0 0 12px; background: #fcfaf6; border: 2px solid var(--line); border-radius: 22px;
            box-shadow: 0 4px 0 var(--line); cursor: pointer; font-family: inherit; text-align: left;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .game-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
        .gc-icon { width: 60px; height: 60px; flex-shrink: 0; border-radius: 18px; overflow: hidden;
                   box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.08); }
        .gc-icon svg { width: 60px; height: 60px; display: block; }
        .gc-text { flex: 1; min-width: 0; }
        .gc-title { font-size: 20px; font-weight: 900; color: var(--ink); line-height: 1.1; }
        .gc-sub { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-top: 2px; }
        .gc-best { font-size: 12px; font-weight: 800; color: #c99a1e; margin-top: 2px; }
        .gc-best:empty { display: none; }
        .gc-go { width: 30px; height: 30px; border-radius: 50%; background: var(--line); color: var(--ink);
                 display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; flex-shrink: 0; }

        #combo-toast {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.6);
            font-weight: 900; font-size: 30px; color: var(--accent);
            text-shadow: 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 6px 12px rgba(119,110,101,0.25);
            pointer-events: none; opacity: 0; z-index: 8; transition: none; white-space: nowrap;
        }
        #combo-toast.pop { animation: comboPop 0.7s ease-out forwards; }
        @keyframes comboPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
            40% { transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
        }

        /* HUD — «табло» как у 2048, но круглее и объёмнее */
        #hud {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 450px; display: none; justify-content: space-between; align-items: center;
            gap: 8px; z-index: 5;
        }
        #hud.glass-panel { background: transparent; border: none; box-shadow: none; padding: 0; }
        .hud-stat { display: flex; flex-direction: column; align-items: center;
                    background: var(--board); border-radius: 16px; padding: 6px 16px 7px; min-width: 80px;
                    box-shadow: 0 4px 0 var(--board-dark); }
        .hud-label { font-size: 11px; font-weight: 800; color: #f3ece4; text-transform: uppercase; letter-spacing: 1.2px; }
        .hud-val { font-size: 22px; font-weight: 900; color: #fff; line-height: 1.1; }
        #val-lives { letter-spacing: 2px; }

        canvas { display: none; position: absolute; top:0; left:0; }
        #game-container { position: absolute; width: 100%; height: 100%; transition: transform 0.05s; }
        .shake { transform: translate(6px, 6px) rotate(1deg); }
        .shake2 { transform: translate(-6px, -6px) rotate(-1deg); }

        /* Сетка 2048: плитки — абсолютные слои, двигаются через transform.
           Так они плавно СКОЛЬЗЯТ к краю, а не телепортируются (раньше
           доска перерисовывалась целиком на каждом ходу). */
        #grid-2048 {
            display: none; position: absolute; top: 48%; left: 50%;
            transform: translate(-50%, -50%); z-index: 4;
            width: 88vw; max-width: 370px; height: 88vw; max-height: 370px;
            border-radius: 22px;
        }
        #grid-2048.glass-panel { background: var(--board); border: none;
                                 box-shadow: 0 6px 0 var(--board-dark), var(--shadow); }
        .cell-bg { position: absolute; border-radius: 14px; background: rgba(238, 228, 218, 0.38); }
        .tile {
            position: absolute; left: 0; top: 0; border-radius: 14px;
            color: var(--ink); will-change: transform;
            transition: transform 0.12s cubic-bezier(.2,.7,.3,1);
        }
        .tile-inner { width: 100%; height: 100%; border-radius: 14px; display: flex; flex-direction: column;
                      align-items: center; justify-content: center; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.08); }
        .tile-icon { width: 30px; height: 30px; margin-bottom: 1px; }
        .tile-name { font-size: 13px; font-weight: 900; }
        .tile-val { font-size: 12px; font-weight: 800; opacity: 0.85; }
        .tile-pop .tile-inner { animation: tilePop 0.2s cubic-bezier(.2,.9,.3,1.3) both; }
        .tile-merged .tile-inner { animation: tileMerge 0.22s ease-out; }
        @keyframes tilePop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes tileMerge { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }
        /* Крупное слияние (256+) — пульс сильнее и дольше */
        .tile-merged-big .tile-inner { animation: tileMergeBig 0.42s cubic-bezier(.2,.9,.3,1.2); }
        @keyframes tileMergeBig {
            0% { transform: scale(1); }
            35% { transform: scale(1.3) rotate(-4deg); box-shadow: 0 0 0 5px rgba(237, 194, 46, 0.55); }
            65% { transform: scale(0.95) rotate(2deg); }
            100% { transform: scale(1); }
        }
        /* Плитку разбили молотком */
        .tile-smash .tile-inner { animation: tileSmash 0.22s ease-in forwards; }
        @keyframes tileSmash { to { transform: scale(0.1) rotate(25deg); opacity: 0; } }
        /* Режим молотка: плитки покачиваются, тап по плитке — разбить */
        #grid-2048.hammer-mode { box-shadow: 0 0 0 4px #f2b179, 0 6px 0 var(--board-dark); }
        #grid-2048.hammer-mode .tile .tile-inner { animation: hammerWobble 0.6s ease-in-out infinite; cursor: crosshair; }
        @keyframes hammerWobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

        /* Инструменты 2048 в HUD: молоток и отмена хода */
        #hud-2048-tools { display: none; gap: 8px; align-items: center; }
        .tool-btn {
            position: relative; min-width: 56px; height: 46px; padding: 0 10px; border-radius: 16px;
            background: var(--btn); border: none; color: #fff; box-shadow: 0 4px 0 var(--btn-dark);
            font-family: inherit; font-weight: 900; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px; overflow: hidden;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-dark); }
        .tool-btn:disabled { opacity: 0.45; cursor: default; }
        .tool-btn.armed { background: var(--accent); box-shadow: 0 4px 0 #c94a2e; }
        .tool-btn .tool-prog { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--gold); width: 0%; transition: width .25s; }
        .tool-btn.gain { animation: toolGain 0.5s ease-out; }
        @keyframes toolGain { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }

        /* Вспышка всего экрана (удар, крупное слияние, рекорд) */
        #fx-flash { position: fixed; inset: 0; pointer-events: none; z-index: 30; opacity: 0; }
        #fx-flash.go { animation: fxFlash 0.35s ease-out forwards; }
        @keyframes fxFlash { 0% { opacity: var(--fa, 0.45); } 100% { opacity: 0; } }
        /* В 2048 холст лежит ПОВЕРХ сетки и рисует только частицы/надписи */
        canvas.fx-overlay { z-index: 6; pointer-events: none; }

        /* Экран итогов */
        .go-medal { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 50%;
                    background: #fbf3d5; display: flex; align-items: center; justify-content: center; }
        .go-medal svg { width: 46px; height: 46px; }
        .go-score-box { background: #f6f1ea; border-radius: 22px; padding: 12px 14px 14px; margin: 14px 0 12px; }
        .go-score-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 1.5px; }
        .go-score-val { font-size: 50px; font-weight: 900; color: var(--ink); line-height: 1.05; }
        #final-record { display: none; margin: 4px 0 2px; font-size: 15px; font-weight: 800; color: var(--accent); }
        .go-coins { margin-bottom: 18px; font-size: 16px; font-weight: 800; color: var(--green); }

        /* Профиль */
        .pf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .pf-avatar { width: 58px; height: 58px; border-radius: 50%; border: 3px solid #fff;
                     box-shadow: 0 0 0 2px var(--line); object-fit: cover; background: #eee4da; }
        .pf-name { font-weight: 900; color: var(--ink); font-size: 19px; }
        .pf-level-title { color: var(--ink-soft); font-size: 13px; font-weight: 800; }
        .pf-stats { display: flex; justify-content: space-around; gap: 8px; margin-bottom: 16px; }
        .pf-stat { flex: 1; background: #f6f1ea; border-radius: 18px; padding: 10px 4px; }
        .pf-stat-val { font-size: 22px; font-weight: 900; color: var(--ink); }
        .pf-stat-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
        .pf-hist-title { text-align: left; font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 800; }
        #pf-history { text-align: left; max-height: 160px; overflow-y: auto; font-size: 14px; font-weight: 700; color: var(--ink); }

        /* Нижняя панель: токены + уровень */
        #bottom-bar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
                      padding: 10px 18px 12px; background: var(--card); border-radius: 22px 22px 0 0;
                      box-shadow: 0 -6px 24px rgba(119, 110, 101, 0.10); }
        .bar-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; color: var(--ink); }
        .bar-row b { font-weight: 900; }
        .bar-track { height: 8px; border-radius: 6px; background: #eee4da; margin-top: 7px; overflow: hidden; }
        #bar-xp { height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, #f2c94c, #edc22e); transition: width .4s; }

        /* Загрузка */
        #loading-console { width: 85%; max-width: 380px; text-align: center; }
        .loading-mark { width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 22px; background: var(--gold);
                        box-shadow: 0 6px 0 #c99a1e; color: #fff; font-size: 22px; font-weight: 900;
                        display: flex; align-items: center; justify-content: center; }
        .loading-title { font-size: 32px; font-weight: 900; color: var(--ink); margin-bottom: 4px; }
        #loading-status { color: var(--ink-soft); font-size: 15px; font-weight: 800; }
        .progress-container { width: 100%; height: 10px; background: #eee4da; border-radius: 6px; overflow: hidden; margin-top: 14px; }
        #loading-bar { width: 0%; height: 100%; border-radius: 6px; background: var(--btn); transition: width .1s; }
        #console-logs {
            margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--ink-soft);
            height: 90px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
        }
        .log-line { margin-bottom: 3px; }
        .log-sys { color: var(--ink-soft); } .log-ok { color: var(--green); }
    </style>
</head>
<body>

    <div id="screen-loading" class="screen active">
        <div id="loading-console">
            <div class="loading-mark">AR</div>
            <div class="loading-title">Avito Radar</div>
            <div id="loading-status">Загрузка…</div>
            <div class="progress-container"><div id="loading-bar"></div></div>
            <div id="console-logs"></div>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <div class="glass-panel menu-box">
            <div class="kicker">Avito Radar</div>
            <h1>Игры</h1>
            <p id="menu-sub">Пока бот ищет — сыграй партию. Лучшие рекорды попадают в общий топ /top.</p>
            <button class="game-card" onclick="startGame('arrows')">
                <div class="gc-icon"><svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#6aaa64"/>
                    <path d="M15 44H30a7 7 0 0 0 7-7V21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M29 27l8-8 8 8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
                <div class="gc-text"><div class="gc-title">Змейки</div><div class="gc-sub">Выпусти всех змеек с поля</div>
                    <div class="gc-best" id="best-arrows"></div></div>
                <div class="gc-go">›</div>
            </button>
            <button class="game-card" onclick="startGame('2048')">
                <div class="gc-icon"><svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#edc22e"/>
                    <text x="30" y="37" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="17" fill="#fff">2048</text></svg></div>
                <div class="gc-text"><div class="gc-title">2048</div><div class="gc-sub">Собирай вещи подороже</div>
                    <div class="gc-best" id="best-2048"></div></div>
                <div class="gc-go">›</div>
            </button>
            <button class="game-card" onclick="startGame('doodle')">
                <div class="gc-icon"><svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#a7d8f5"/>
                    <rect x="11" y="46" width="38" height="7" rx="3.5" fill="#7cc25c" stroke="#4e8f35" stroke-width="2"/>
                    <path d="M24 35l-2 7M30 35v7M36 35l2 7" stroke="#4f7f2f" stroke-width="2.6" stroke-linecap="round"/>
                    <rect x="18" y="13" width="24" height="23" rx="8" fill="#a8d672" stroke="#4f7f2f" stroke-width="2.4"/>
                    <circle cx="25" cy="22" r="3.6" fill="#fff"/><circle cx="35" cy="22" r="3.6" fill="#fff"/>
                    <circle cx="25.8" cy="22" r="1.7" fill="#3b3b3b"/><circle cx="35.8" cy="22" r="1.7" fill="#3b3b3b"/>
                    <path d="M26 28q4 3 8 0" fill="none" stroke="#4f7f2f" stroke-width="2" stroke-linecap="round"/></svg></div>
                <div class="gc-text"><div class="gc-title">Прыгун</div><div class="gc-sub">Прыгай как можно выше</div>
                    <div class="gc-best" id="best-doodle"></div></div>
                <div class="gc-go">›</div>
            </button>
            <button class="btn-neon btn-secondary" style="margin-top:6px;" onclick="openProfile()">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/>
                </svg> Профиль
            </button>
        </div>
    </div>

    <!-- Экран профиля: аватар/имя бота, токены, уровень, история поисков -->
    <div id="screen-profile" class="screen">
        <div class="glass-panel menu-box">
            <div class="pf-head">
                <img id="pf-avatar" class="pf-avatar" src="" alt="" onerror="this.style.display='none'">
                <div style="text-align:left;">
                    <div id="pf-name" class="pf-name">ItemFinder</div>
                    <div id="pf-level-title" class="pf-level-title">Уровень 1</div>
                </div>
            </div>
            <div class="pf-stats">
                <div class="pf-stat"><div class="pf-stat-val" id="pf-tokens">0</div>
                     <div class="pf-stat-label">🪙 токенов</div></div>
                <div class="pf-stat"><div class="pf-stat-val" id="pf-searches">0</div>
                     <div class="pf-stat-label">🔍 поисков</div></div>
                <div class="pf-stat"><div class="pf-stat-val" id="pf-level">1</div>
                     <div class="pf-stat-label">⭐ уровень</div></div>
            </div>
            <div class="pf-hist-title">Последние поиски</div>
            <div id="pf-history"></div>
            <button class="btn-neon" style="margin-top:18px;" onclick="closeProfile()">← В меню</button>
        </div>
    </div>

    <div id="screen-gameover" class="screen">
        <div class="glass-panel menu-box">
            <div class="go-medal"><svg viewBox="0 0 48 48">
                <path d="M14 8h20v8a10 10 0 0 1-20 0z" fill="#edc22e" stroke="#c99a1e" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M14 11H8a6 6 0 0 0 6 7M34 11h6a6 6 0 0 1-6 7" fill="none" stroke="#c99a1e" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M24 26v7" stroke="#c99a1e" stroke-width="3"/><rect x="16" y="33" width="16" height="6" rx="2" fill="#c99a1e"/></svg></div>
            <h1 style="font-size: 28px;">Игра окончена</h1>
            <div class="go-score-box">
                <div class="go-score-label">Счёт</div>
                <div class="go-score-val" id="final-score">0</div>
                <div id="final-record"></div>
            </div>
            <div class="go-coins" id="go-coins">
                Токенов за игру: ~<span id="final-coins">0</span> 🪙
            </div>
            <button id="btn-finish" class="btn-neon" onclick="finishSession()">Сохранить рекорд</button>
        </div>
    </div>

    <div id="game-container">
        <div id="hud" class="glass-panel">
            <div class="hud-stat"><span class="hud-label">Очки</span><span class="hud-val" id="val-score">0</span></div>
            <div class="hud-stat" id="ui-time-box"><span class="hud-label">Уровень</span><span class="hud-val" id="val-time">120</span></div>
            <div class="hud-stat" id="ui-lives-box"><span class="hud-label">Жизни</span><span class="hud-val" id="val-lives">|||||</span></div>
            <!-- Бонусы 2048: зарабатываются игрой (не покупаются) -->
            <div id="hud-2048-tools">
                <button id="btn-hammer" class="tool-btn" onclick="toggle2048Hammer()" title="Молоток: убрать одну плитку">🔨<span id="cnt-hammer">0</span><span class="tool-prog" id="prog-hammer"></span></button>
                <button id="btn-undo" class="tool-btn" onclick="undo2048()" title="Отменить последний ход">↩️<span id="cnt-undo">0</span></button>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="grid-2048" class="glass-panel"></div>
        <div id="combo-toast"></div>
        <button id="btn-ingame-exit" class="btn-neon btn-exit" style="display:none; position:absolute; bottom:22px; left:50%; transform:translateX(-50%); width: 85%; max-width:340px; z-index:10;" onclick="gameOver()">Завершить игру</button>
    </div>
    <!-- Вспышка — вне game-container, чтобы тряска (transform) не загоняла её под экраны -->
    <div id="fx-flash"></div>

    <!-- Нижняя панель: баланс токенов + уровень игрока (XP). Видна в меню и
         профиле, прячется во время самой игры, чтобы не мешать. -->
    <div id="bottom-bar">
        <div class="bar-row">
            <span>🪙 <b id="bar-tokens">0</b></span>
            <span>⭐ ур. <b id="bar-level">1</b></span>
        </div>
        <div class="bar-track"><div id="bar-xp"></div></div>
    </div>

<script>
    // Инициализация Telegram
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    // Внутри ли мы Telegram — определяем по platform, а НЕ по initData.
    // Игра открывается кнопкой нижней клавиатуры (только так работает
    // sendData), а в этом режиме Telegram НЕ передаёт initData — она пустая.
    // Старая проверка «initData не пустая» поэтому решала, что мы в обычном
    // браузере, и очки боту не отправлялись вообще.
    let isTgEnv = !!(tg && tg.platform && tg.platform !== 'unknown');
    // sendData доступен только при запуске с кнопки клавиатуры — это как
    // раз тот случай, когда initData пустая.
    let canSendData = isTgEnv && !tg.initData;
    if (isTgEnv) {
        tg.expand(); tg.ready();
        // Шапка и фон Telegram — под светлую тему игры (в старых клиентах этих методов нет)
        try { if (tg.setHeaderColor) tg.setHeaderColor('#faf8ef'); } catch (e) {}
        try { if (tg.setBackgroundColor) tg.setBackgroundColor('#faf8ef'); } catch (e) {}
    }

    // ===== ПРОФИЛЬ ИГРОКА (данные прокидывает бот через параметры URL) =====
    // Бот открывает WebApp по адресу вида
    //   .../avito_radar_hub.html?tokens=1234&name=ItemFinder&avatar=...&searches=42&xp=5600&history=<url-encoded JSON>
    // Всё опционально: если параметра нет — берём значение по умолчанию,
    // поэтому игра открывается и вне Telegram (для теста) без ошибок.
    const _params = new URLSearchParams(location.search);
    // Telegram может продублировать данные в start_param (startapp) — на будущее.
    function _num(v, d) { const n = parseInt(v, 10); return isNaN(n) ? d : n; }
    const profile = {
        tokens: _num(_params.get('tokens'), 0),
        name: _params.get('name') || 'ItemFinder',
        avatar: _params.get('avatar') || '',
        searches: _num(_params.get('searches'), 0),
        xp: _num(_params.get('xp'), 0),   // всего заработано коинов за всё время (не падает)
        history: [],
        // Делители очков -> токены и остаток лимита заработка присылает бот.
        // Нет параметров (старая ссылка, тест вне Telegram) — запасные значения.
        div: {
            arrows: _num(_params.get('d_arrows'), 8),
            '2048': _num(_params.get('d_2048'), 4),
            doodle: _num(_params.get('d_doodle'), 6),
        },
        gcap: _num(_params.get('gcap'), 100),
    };
    // Токены за игру бот выключил 13.10: без параметра tok=1 игра — просто игра
    // (рекорды уходят в /top), без «заработай токены».
    const TOKENS_ON = _params.get('tok') === '1';
    if (TOKENS_ON) {
        document.getElementById('menu-sub').innerText = 'Пока бот ищет — сыграй партию и заработай токены на поиски.';
        document.getElementById('btn-finish').innerText = 'Забрать токены';
    } else {
        document.getElementById('go-coins').style.display = 'none';
    }
    try {
        const h = _params.get('history');
        if (h) profile.history = JSON.parse(decodeURIComponent(h));
    } catch (e) { profile.history = []; }

    // Уровень игрока: чтобы перейти с уровня L на L+1, нужно 100*L коинов
    // суммарно сверх начала уровня. Кривая мягкая на старте, дальше растёт.
    function levelFromXp(xp) {
        let level = 1, need = 100, acc = 0;
        while (xp >= acc + need) { acc += need; level++; need = 100 * level; }
        return { level, curXp: xp - acc, needXp: need, pct: Math.round((xp - acc) / need * 100) };
    }

    function renderBottomBar() {
        const li = levelFromXp(profile.xp);
        document.getElementById('bar-tokens').innerText = profile.tokens;
        document.getElementById('bar-level').innerText = li.level;
        document.getElementById('bar-xp').style.width = Math.min(100, li.pct) + '%';
    }
    function showBottomBar(show) {
        document.getElementById('bottom-bar').style.display = (show && TOKENS_ON) ? 'block' : 'none';
    }

    function openProfile() {
        const li = levelFromXp(profile.xp);
        document.getElementById('pf-name').innerText = profile.name;
        document.getElementById('pf-level-title').innerText = 'Уровень ' + li.level;
        document.getElementById('pf-tokens').innerText = profile.tokens;
        document.getElementById('pf-searches').innerText = profile.searches;
        document.getElementById('pf-level').innerText = li.level;
        const av = document.getElementById('pf-avatar');
        if (profile.avatar) { av.src = profile.avatar; av.style.display = 'block'; }
        else { av.style.display = 'none'; }
        const hist = document.getElementById('pf-history');
        if (profile.history.length) {
            hist.innerHTML = profile.history.map(function(s) {
                return '<div style="padding:5px 0; border-bottom:1px solid #eee4da;">🔍 ' +
                    String(s).replace(/</g, '&lt;') + '</div>';
            }).join('');
        } else {
            hist.innerHTML = '<div style="color:#9b9188;">История пуста — сделай первый поиск в боте.</div>';
        }
        document.getElementById('screen-menu').classList.remove('active');
        document.getElementById('screen-profile').classList.add('active');
    }
    function closeProfile() {
        document.getElementById('screen-profile').classList.remove('active');
        document.getElementById('screen-menu').classList.add('active');
        renderMenuBests();
    }
    // Личный рекорд на карточке каждой игры в меню
    function renderMenuBests() {
        for (const g of ['arrows', '2048', 'doodle']) {
            const el = document.getElementById('best-' + g);
            if (!el) continue;
            const b = loadBest(g);
            el.textContent = b > 0 ? '🏆 Рекорд: ' + b : '';
        }
    }

    const UI_FONT = '"Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const grid2048 = document.getElementById('grid-2048');
    
    let width, height;
    function resize() {
        width = window.innerWidth; height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        // setTransform, а не scale: scale умножается на предыдущий, и после
        // каждого поворота экрана картинка становилась всё крупнее и уезжала.
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize); resize();

    // Синтезатор звуков
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSynth(type) {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'good') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.08);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'hit') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
            gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
            osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'jump') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
            gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'merge') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.06);
            gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
            osc.start(now); osc.stop(now + 0.06);
        } else if (type === 'stomp') {
            // Расплющили монстра: короткий «чпок» сверху вниз
            osc.type = 'square'; osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
            gain.gain.setValueAtTime(0.13, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
            osc.start(now); osc.stop(now + 0.14);
        } else if (type === 'big') {
            // Крупное слияние / уровень пройден: длинный подъём
            osc.type = 'triangle'; osc.frequency.setValueAtTime(330, now);
            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.3);
            gain.gain.setValueAtTime(0.16, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.32);
            osc.start(now); osc.stop(now + 0.32);
        } else if (type === 'record') {
            // Рекорд: две ступеньки вверх
            osc.type = 'triangle'; osc.frequency.setValueAtTime(660, now);
            osc.frequency.setValueAtTime(880, now + 0.1); osc.frequency.setValueAtTime(1320, now + 0.2);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else {
            // Неизвестный звук — просто молчим (и не оставляем висящий осциллятор)
            osc.start(now); osc.stop(now + 0.001); gain.gain.setValueAtTime(0, now);
        }
    }

    // Состояние игры
    let currentGame = '';
    let isPlaying = false, score = 0, bonusCoins = 0, lives = 5, timeLeft = 120;
    let lastTime = 0, spawnTimer = 0, gameReq, timeInt, invulnerableTimer = 0;
    let bgOffset = 0, playerX = width / 2;
    let items = [], particles = [], floatTexts = [], bonuses = [];
    let board2048 = [], lockedUsed2048 = false;
    let doodleY = 0, doodleVy = 0, doodleX = 0, doodlePlatforms = [], doodleHeight = 0, doodleBestY = 0, doodleTilt = 0;
    let doodleSquash = 1; // 1 = обычная форма, <1 = приплющен при отскоке
    let gameElapsed = 0; // секунды с начала текущего забега — общий множитель сложности
    function difficultyMult() { return Math.min(1 + gameElapsed / 35, 2.6); } // за ~90с сложность растёт до x2.6

    // --- Комбо-система (общая для всех игр) ---
    let combo = 0, comboBest = 0, comboFlashUntil = 0;
    const COMBO_MILESTONES = [3, 5, 8, 12, 18, 25, 35, 50];
    function bumpCombo(x, y) {
        combo++;
        if (combo > comboBest) comboBest = combo;
        if (COMBO_MILESTONES.includes(combo)) {
            createFloatingText(x, y, `🔥 КОМБО x${combo}`, '#d9a400');
            playSynth('good');
            if (combo % 10 === 0) { bonusCoins += 1; } // каждые 10 в комбо — бонусная монета сверху
        }
    }
    function resetCombo() { combo = 0; }
    function showComboToast(text) {
        let el = document.getElementById('combo-toast');
        el.textContent = text; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    }
    function comboMult() { return 1 + Math.min(combo, 20) * 0.04; } // до +80% к очкам на самом длинном комбо

    // --- Прыгун: джетпак (рюкзак) и пружины ---
    let doodleJetpackUntil = 0; // timestamp (ms) до которого активен джетпак
    // --- Физика Прыгуна (всё в px/с и px/с², не «за кадр») ---
    // Прыжки сделаны помедленнее и повыше, чем были: гравитация снижена с
    // 1980 до 1400, скорость с 930 до 820. Высота подъёма даже выросла
    // (218 -> 240px), но времени в воздухе стало на четверть больше — успеваешь
    // прицелиться и доехать вбок.
    const DOODLE_GRAVITY = 1400;
    const DOODLE_JUMP_NORMAL = -820;
    const DOODLE_JUMP_COIN = -1005;
    const DOODLE_JUMP_SPRING = -1430;
    const DOODLE_JETPACK_VY = -900;
    const DOODLE_START_VY = -740;
    // Скорость горизонтального доводчика (чем больше, тем резвее едет вбок).
    const DOODLE_H_SPEED = 12;
    // Насколько вбок может уехать следующая платформа от предыдущей.
    // Считается от ширины экрана, но не больше 170px — при такой дистанции
    // за время подъёма успеваешь доехать даже на слабом телефоне.
    const DOODLE_MAX_DX = Math.min(width * 0.42, 170);
    // Разрыв по вертикали: максимум 150px при досягаемых 240px — запас 90px
    // на случай, если пришлось гасить скорость об движущуюся платформу.
    const DOODLE_GAP_MIN = 66;
    const DOODLE_GAP_MAX = 150;

    const DOODLE_JETPACK_DURATION = 4000;  // мс свободного полёта вверх
    // Пружинные ботинки: не разовый отскок, а надетый бонус на 10 секунд —
    // пока активны, КАЖДЫЙ прыжок с платформы вдвое выше обычного.
    let doodleBootsUntil = 0;
    const DOODLE_BOOTS_DURATION = 10000;
    const DOODLE_BOOTS_MULTIPLIER = 1.55;

    // --- Очки Прыгуна ---
    // Раньше очки = высота в пикселях, и сильный игрок за минуту набирал
    // 15–18 тыс. при серверном потолке 5000 (выше — «накрутка»). Теперь
    // одно очко = DOODLE_PX_PER_POINT пикселей высоты + скромные бонусы.
    const DOODLE_PX_PER_POINT = 8;
    const DOODLE_MONSTER_POINTS = 15;        // за растоптанного монстра
    const DOODLE_MONSTER_KNOCK_POINTS = 5;   // за сбитого в полёте (джетпак/пропеллер)

    // --- Пропеллер: слабее и короче джетпака ---
    const DOODLE_PROPELLER_DURATION = 2600;  // мс
    const DOODLE_PROPELLER_VY = -620;        // px/с (джетпак — -900)

    // --- Монстры, чёрные дыры и исчезающие платформы ---
    const DOODLE_PLAYER_HALF = 18;           // полуширина кубика (хитбокс)
    const DOODLE_SAFE_MARGIN = 10;           // запас между «коридором» пути и опасностью
    const DOODLE_SPAWN_AHEAD = 420;          // на сколько px выше экрана заранее строим уровень
    const DOODLE_MONSTER_START = 1200;       // с какой высоты (px) появляются монстры
    const DOODLE_HOLE_START = 4200;          // с какой высоты возможны чёрные дыры
    const DOODLE_VANISH_START = 700;         // с какой высоты бывают исчезающие платформы
    const DOODLE_HAZARD_RAMP = 6000;         // за сколько px шанс опасности дорастает до максимума
    const DOODLE_HAZARD_CHANCE_MIN = 0.30;   // шанс начать «секцию с опасностью» на каждой платформе
    const DOODLE_HAZARD_CHANCE_MAX = 0.55;
    const DOODLE_HAZARD_COOLDOWN = 600;      // минимум px по высоте между двумя опасностями
    const DOODLE_HOLE_SHARE = 0.18;          // доля чёрных дыр среди опасностей
    const DOODLE_SECTION_MAX = 7;            // столько платформ максимум ждём места под опасность
    const DOODLE_BOOTS_HAZARD_GRACE = 1700;  // мс после конца ботинок без новых опасностей
    const DOODLE_JUMP_MONSTER = -900;        // отскок от растоптанного монстра
    const DOODLE_HOLE_R = 22;                // радиус «смертельной» части дыры
    const DOODLE_HOLE_SUCK_TIME = 0.6;       // с — затягивание в дыру
    const DOODLE_DEATH_TIME = 1.0;           // с — падение после удара монстра
    const DOODLE_FALL_DEATH_TIME = 0.35;     // с — пауза после падения за экран
    const DOODLE_SHAKE_DECAY = 9;            // 1/с — как быстро затухает тряска камеры
    const DOODLE_VANISH_FADE = 4;            // 1/с — как быстро тает исчезающая платформа
    // Виды монстров: r — радиус хитбокса, range — размах полёта вбок,
    // bob — покачивание по вертикали, speed — рад/с фазы, minAlt — с какой высоты.
    const DOODLE_MONSTERS = {
        blob:  { r: 19, range: 0,  bob: 5, speed: 2.4, minAlt: 0,    color: '#9b7ad8' },
        bat:   { r: 16, range: 38, bob: 7, speed: 1.9, minAlt: 2600, color: '#e0609a' },
        brute: { r: 23, range: 22, bob: 3, speed: 1.2, minAlt: 4000, color: '#e5533d' },
    };

    let doodlePropUntil = 0;       // timestamp (ms) конца пропеллера
    let doodleMonsters = [], doodleHoles = [];
    let doodleChain = [];          // платформы ОСНОВНОГО пути (без ловушек) — по ним гарантирована досягаемость
    let doodleSection = null;      // «секция»: путь уводится в сторону, чтобы освободить место под опасность
    let doodleLastHazardAlt = -1e9, doodleLastBootsAlt = -1e9;
    let doodleBonus = 0;           // бонусные очки (монстры) поверх высоты
    let doodleShake = 0;           // амплитуда тряски камеры, px
    let doodleDead = null;         // {kind: 'monster'|'hole'|'fall', t, hx, hy} — анимация гибели
    let doodleScale = 1;           // масштаб кубика (затягивание в дыру)

    // Управление
    const moveHandler = (e) => { playerX = (e.touches ? e.touches[0].clientX : e.clientX); };
    window.addEventListener('touchmove', moveHandler, {passive: true});
    window.addEventListener('mousemove', moveHandler);

    // Загрузка
    const bootLogs = [
        "<span class='log-sys'>•</span> Раскладываю плитки…",
        "<span class='log-sys'>•</span> Расставляю платформы…",
        "<span class='log-sys'>•</span> Бужу змеек…",
        "<span class='log-ok'>✓</span> Готово!"
    ];

    function runBootSequence() {
        let progress = 0, logIdx = 0;
        const barEl = document.getElementById('loading-bar');
        const logsEl = document.getElementById('console-logs');
        const statusEl = document.getElementById('loading-status');

        let interval = setInterval(() => {
            progress += Math.random() * 14 + 6;
            if (progress >= 100) progress = 100;
            barEl.style.width = progress + '%';

            if (logIdx < bootLogs.length) {
                const p = document.createElement('div'); p.className = 'log-line'; p.innerHTML = bootLogs[logIdx];
                logsEl.appendChild(p);
                if (logsEl.children.length > 4) logsEl.removeChild(logsEl.firstChild);
                logIdx++;
            }

            if (progress === 100) {
                clearInterval(interval); statusEl.innerText = "Готово";
                setTimeout(() => {
                    document.getElementById('screen-loading').classList.remove('active');
                    document.getElementById('screen-menu').classList.add('active');
                    renderBottomBar(); showBottomBar(true); renderMenuBests();
                }, 400);
            }
        }, 110);
    }
    
    // Более надежный способ запуска экрана загрузки
    document.addEventListener("DOMContentLoaded", runBootSequence);

    // Вибрация телефона. В старых клиентах Telegram HapticFeedback может не
    // быть — без проверки это исключение, а внутри игрового цикла оно
    // молча замораживает игру.
    function haptic(kind) {
        try { if (isTgEnv && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
    }

    function shakeScreen() {
        haptic('heavy');
        container.classList.add('shake');
        setTimeout(() => container.classList.replace('shake', 'shake2'), 50);
        setTimeout(() => container.classList.remove('shake2'), 100);
    }

    // Скорости частиц — в px/с (раньше «px за кадр», и на 120 Гц экранах
    // всё летало вдвое быстрее, а на слабых телефонах дёргалось).
    function createParticle(x, y, color, count, speed, size) {
        count = count || 10; speed = speed || 600; size = size || 3;
        for (let i = 0; i < count; i++) {
            let a = Math.random() * Math.PI * 2, v = speed * (0.35 + Math.random() * 0.65);
            particles.push({ x, y, vx: Math.cos(a) * v / 2, vy: Math.sin(a) * v / 2, life: 1, color, size, g: 0 });
        }
    }
    // Пыль из-под ног: летит вбок и чуть вверх, быстро тает.
    function createDust(x, y, color) {
        for (let i = 0; i < 7; i++) {
            let side = i % 2 ? 1 : -1;
            particles.push({ x: x + side * 6, y, vx: side * (60 + Math.random() * 110), vy: -(20 + Math.random() * 60),
                             life: 0.7, color: color || 'rgba(160,150,140,0.7)', size: 2 + Math.random() * 2, g: 260 });
        }
    }
    function createFloatingText(x, y, text, color) { floatTexts.push({ x, y, text, color, life: 1, vy: -70, scale: 0.6 }); }

    // Конфетти: летят вверх веером и падают под гравитацией (всё в px/с).
    function createConfetti(x, y, count, spread) {
        const colors = ['#f65e3b', '#edc22e', '#6aaa64', '#4a90d9', '#f2b179'];
        for (let i = 0; i < (count || 30); i++) {
            const a = -Math.PI / 2 + (Math.random() * 2 - 1) * (spread || 0.9);
            const v = 380 + Math.random() * 420;
            particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.4,
                             color: colors[i % colors.length], size: 2.5 + Math.random() * 2.5, g: 900 });
        }
    }

    // Вспышка всего экрана поверх всего (кроме нижней панели).
    function flashScreen(color, alpha) {
        const el = document.getElementById('fx-flash');
        if (!el) return;
        el.style.background = color || '#ffffff';
        el.style.setProperty('--fa', String(alpha || 0.4));
        el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    }

    // Полифилл roundRect: в старых WebView (iOS < 16, старый Android) его нет,
    // и первый же вызов бросал исключение внутри игрового цикла.
    if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            r = Math.max(0, Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2));
            this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
        };
    }

    // Обёртка кадра: если внутри шага что-то бросит, игра не замёрзнет —
    // ошибка уйдёт в консоль, а следующий кадр всё равно запланируется.
    // (Сам шаг планирует кадр в самом конце, поэтому двойного кадра нет.)
    function safeFrame(step) {
        const wrapped = function (time) {
            try { step(time); }
            catch (e) { console.error('[игровой цикл]', e); if (isPlaying) gameReq = requestAnimationFrame(wrapped); }
        };
        return wrapped;
    }

    // --- Защитный потолок очков ---
    // Сервер считает всё выше GAME_MAX_SCORE накруткой (arrows 12000,
    // 2048 40000, doodle 5000). Очень длинная честная игра не должна
    // выглядеть как читерство — поэтому держим счёт чуть ниже потолка.
    const SCORE_SAFE_MAX = { arrows: 11400, '2048': 38000, doodle: 4750 };
    function clampScore() {
        const cap = SCORE_SAFE_MAX[currentGame];
        if (cap && score > cap) score = cap;
        if (!(score >= 0)) score = 0;  // и от NaN тоже
    }

    // --- Личный рекорд ---
    // Бот пока не передаёт рекорд в игру, поэтому помним его на устройстве
    // (localStorage). Если бот когда-нибудь пришлёт параметр best_<игра>
    // (например best_doodle=1234), возьмём максимум из двух.
    const RECORD_KEY_PREFIX = 'arh_best_';
    let bestScoreRun = 0, recordCelebrated = false;
    function loadBest(game) {
        let b = _num(_params.get('best_' + game), 0);
        try { b = Math.max(b, parseInt(localStorage.getItem(RECORD_KEY_PREFIX + game), 10) || 0); } catch (e) {}
        return Math.max(0, b);
    }
    function saveBest(game, value) {
        try { localStorage.setItem(RECORD_KEY_PREFIX + game, String(value)); } catch (e) {}
    }
    function checkRecord() {
        // Празднуем один раз за забег и только если рекорд уже был
        // (первая игра — не «новый рекорд», а просто первая игра).
        if (recordCelebrated || !isPlaying || bestScoreRun <= 0 || score <= bestScoreRun) return;
        recordCelebrated = true;
        showComboToast('🏆 НОВЫЙ РЕКОРД!');
        flashScreen('#d9a400', 0.3);
        playSynth('record');
        haptic('medium');
        createConfetti(width * 0.2, height * 0.35, 18, 0.7);
        createConfetti(width * 0.8, height * 0.35, 18, 0.7);
    }

    function updateHud() {
        clampScore();
        checkRecord();
        document.getElementById('val-score').innerText = score;
        document.getElementById('val-time').innerText = timeLeft;
        // Math.max обязателен: String.repeat(-1) бросает RangeError и роняет
        // весь игровой цикл. Ловится это только так — при отрицательных
        // жизнях (бомба снимает 2, а оставалась 1) экран просто гас.
        document.getElementById('val-lives').innerText = '|'.repeat(Math.max(0, lives));
    }

    function calculateCoins(score, gameType) {
        // Те же делители, что у бота (GAME_TOKEN_DIVISORS в config.py) —
        // чтобы обещанное на экране совпадало с тем, что придёт. Бот ещё
        // добавит бонус за рекорд и учтёт дневной лимит.
        const d = profile.div[gameType];
        return d ? Math.floor(score / d) : 0;
    }

    function gameOver() {
        if (!isPlaying && document.getElementById('screen-gameover').classList.contains('active')) return; // повторный вызов (таймер + кнопка)
        isPlaying = false;
        cancelAnimationFrame(gameReq); clearInterval(timeInt);
        clampScore();
        hammerMode2048 = false; grid2048.classList.remove('hammer-mode');
        document.getElementById('hud-2048-tools').style.display = 'none';
        canvas.classList.remove('fx-overlay');
        // Рекорд: показываем на экране итогов и запоминаем на устройстве
        const recEl = document.getElementById('final-record');
        if (score > bestScoreRun) {
            if (bestScoreRun > 0) { recEl.innerText = `🏆 Новый рекорд! Было: ${bestScoreRun}`; recEl.style.display = 'block'; }
            else recEl.style.display = 'none';
            if (score > 0) saveBest(currentGame, score);
        } else if (bestScoreRun > 0) {
            recEl.innerText = `Твой рекорд: ${bestScoreRun}`; recEl.style.display = 'block';
        } else recEl.style.display = 'none';
        canvas.style.display = 'none'; grid2048.style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('btn-ingame-exit').style.display = 'none';
        document.getElementById('screen-gameover').classList.add('active');

        // Оценка того, что начислит бот: его делители и дневной потолок 300
        // (бот сам пересчитает по очкам — числу из браузера он не верит).
        bonusCoins = TOKENS_ON ? Math.max(0, Math.min(calculateCoins(score, currentGame), profile.gcap)) : 0;
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-coins').innerText = bonusCoins;
        renderBottomBar(); showBottomBar(true);

        if (isTgEnv) {
            tg.MainButton.text = TOKENS_ON ? `🪙 ЗАБРАТЬ ~${bonusCoins} ТОКЕНОВ` : '🏆 СОХРАНИТЬ РЕКОРД';
            tg.MainButton.color = "#8f7a66"; tg.MainButton.textColor = "#ffffff";
            tg.MainButton.offClick(finishSession);   // не копим обработчики от прошлых игр
            tg.MainButton.onClick(finishSession);
            tg.MainButton.show();
            // Закрыл крестиком, не забрав токены, — спросим «точно?»,
            // иначе результат молча терялся.
            if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
        }
    }

    let sessionSent = false;
    function finishSession() {
        if (sessionSent) return;  // двойной тап по кнопке — не шлём дважды
        // Оптимистично докидываем заработанное в панель, чтобы игрок сразу
        // увидел рост токенов и уровня. Настоящие значения бот пересчитает и
        // подставит при следующем открытии игры.
        profile.tokens += bonusCoins;
        profile.xp += bonusCoins;
        renderBottomBar();

        const payload = {
            action: "game_result",
            game: currentGame,
            score: score,
            bonus_coins: bonusCoins
        };

        if (canSendData) {
            sessionSent = true;
            if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
            tg.sendData(JSON.stringify(payload));   // Telegram сам закроет игру
            setTimeout(() => tg.close(), 300);
        } else if (isTgEnv) {
            // Открыли не той кнопкой (например, из меню бота или по ссылке) —
            // в этом режиме Telegram не даёт игре передать очки. Честно говорим.
            if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
            tg.MainButton.hide();
            const msgBox = document.querySelector('#screen-gameover .menu-box');
            msgBox.innerHTML = (TOKENS_ON ? '<h1 style="font-size:22px;">⚠️ Токены не зачтутся</h1>' : '<h1 style="font-size:22px;">⚠️ Рекорд не сохранится</h1>') +
                '<p>Игра открыта не той кнопкой. Чтобы результат дошёл до бота, открой её кнопкой ' +
                '<b>«🎮 Играть»</b> внизу чата с ботом.</p>' +
                '<button class="btn-neon" onclick="tg.close()">Понятно</button>';
        } else {
            alert(`Данные для бота:\n\nИгра: ${currentGame}\nОчки: ${score}\nКоины: ${bonusCoins} 🪙\n\nВ реальном боте интерфейс закроется сам.`);
            document.location.reload();
        }
    }

    function drawBackground(dt) {
        bgOffset = (bgOffset + 60 * (dt || 1 / 60)) % 40;
        ctx.strokeStyle = 'rgba(119, 110, 101, 0.08)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let x = 0; x < width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
        for (let y = bgOffset; y < height; y += 40) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
        ctx.stroke();
    }

    function updateAndDrawParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
            p.vx *= Math.exp(-3 * dt);
            ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, (p.size || 3) * (0.5 + Math.max(0, p.life) * 0.5), 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
        
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            let t = floatTexts[i]; t.y += t.vy * dt; t.vy *= Math.exp(-2.5 * dt); t.life -= dt * 1.3;
            // Надпись «выпрыгивает»: быстро растёт до 1.15, потом оседает к 1
            t.scale += ((t.life > 0.8 ? 1.15 : 1) - t.scale) * (1 - Math.exp(-14 * dt));
            ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.6)); ctx.fillStyle = t.color;
            ctx.font = '900 19px ' + UI_FONT; ctx.textAlign = 'center';
            // Не даём надписи у края экрана уехать за его пределы
            const hw = ctx.measureText(t.text).width * t.scale / 2 + 6;
            const tx = hw * 2 >= width ? width / 2 : Math.max(hw, Math.min(width - hw, t.x));
            ctx.save(); ctx.translate(tx, t.y); ctx.scale(t.scale, t.scale);
            // Белая обводка вместо неонового свечения — читается на светлом фоне
            ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.strokeText(t.text, 0, 0);
            ctx.fillText(t.text, 0, 0); ctx.restore();
            if(t.life <= 0) floatTexts.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    // --- 2048 ---
    const tMap = {
        2:   {n:'Носки', c:'#eee4da', tc:'#776e65', fx:'#a39383', svg:'<path d="M6 3v12c0 3 3 6 6 6s6-3 6-6V9h-4V3H6z" fill="currentColor"/>'},

        8:   {n:'Кроссы', c:'#f2b179', tc:'#f9f6f2', fx:'#e8955a', svg:'<path d="M3 13l4-7h5l2 3h4c2 0 3 2 3 4v3H3v-3z" fill="currentColor"/>'},
        16:  {n:'Худи',  c:'#f59563', tc:'#f9f6f2', fx:'#ec7d43', svg:'<path d="M8 4l4 3 4-3 5 3-2 13H5L3 7l5-3z" fill="currentColor"/>'},
        32:  {n:'Часы',  c:'#f67c5f', tc:'#f9f6f2', fx:'#ee6847', svg:'<circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2"/>'},
        64:  {n:'Планшет',c:'#f65e3b', tc:'#f9f6f2', fx:'#e9502c', svg:'<rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18" r="1" fill="currentColor"/>'},
        128: {n:'Смарт', c:'#edcf72', tc:'#f9f6f2', fx:'#d9b23a', svg:'<rect x="6" y="2" width="12" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>'},
        256: {n:'Ноут',  c:'#edcc61', tc:'#f9f6f2', fx:'#d4ab2b', svg:'<rect x="5" y="5" width="14" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 18h20v1H2z" fill="currentColor"/>'},
